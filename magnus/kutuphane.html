<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="ikon-192.png"><link rel="apple-touch-icon" href="ikon-192.png"><meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Magnus · Kütüphane</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
#ipucu{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  color:#777;font:13px/1.4 system-ui,sans-serif;letter-spacing:.5px;
  transition:opacity 1.2s;pointer-events:none
}
body.sakin{cursor:none}
</style>
</head>
<body data-sahne="kutuphane">
<canvas id="c"></canvas>
<script>
/* MAGNUS — ASCII kütüphane (25 Eylül; orman sahnesinin (magnus.html) kardeşi).
   Gökşin'in tablosunun kurgusu: üç sütun raf, yerde kitap okuyan Magnus, solunda mum.
   Hareketler (Gökşin): nefes · sayfa kendiliğinden döner · mum süzülür · kitaplar raftan
   kalkıp süzülerek başka rafa geçer (döngü içinde yerlerine döner → dikişsiz).
   Arka plan siyah-beyaz, mum ışığı sarı-turuncu; Magnus kendi renginde.
   Deneme: ?t=20 → o saniyede donmuş kare. */
const T = 144, T_KUCUK = 72;
// Orman 110 satır; kütüphanede 110'da kitaplar karakter duvarına dönüştü → daha iri (en çok 72)
const SATIR = Math.max(50, Math.min(72, Math.round(innerHeight / 12)));
const c = document.getElementById("c"), ctx = c.getContext("2d");
const P = new URLSearchParams(location.search);
const DONUK = P.has("t") ? parseFloat(P.get("t")) : null;
const dalga = (k, t, faz = 0) => Math.sin(2 * Math.PI * k * t / T_KUCUK + faz);
const yumusak = u => u * u * (3 - 2 * u);
function rastgele(tohum){ return () => { tohum |= 0; tohum = tohum + 0x6D2B79F5 | 0;
  let x = Math.imul(tohum ^ tohum >>> 15, 1 | tohum); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x;
  return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

let W, H, cw, ch, SUTUN, ARKA = null, izg = null, UCANLAR = [];
const yazi = () => `${Math.round(ch * 0.86)}px Consolas, "Courier New", monospace`;

/* ── KİTAPLIK: tablodaki gibi dar-geniş-dar üç sütun, beş raf ─────────────── */
function kitaplikKur(){
  const R = rastgele(11);
  izg = Array.from({length: SATIR}, () => Array(SUTUN).fill(null));
  const koy = (x, y, k, b) => { if (x >= 0 && x < SUTUN && y >= 0 && y < SATIR) izg[y][x] = [k, b]; };
  const direkler = [Math.round(SUTUN * 0.18), Math.round(SUTUN * 0.79)], DG = 3;
  const raflar = [0.07, 0.25, 0.43, 0.61, 0.75].map(f => Math.round(SATIR * f));
  const kutular = [];                                    // raf bölmeleri: {x0,x1,ust,alt}
  // tahtalar
  for (const y of raflar) for (let x = 0; x < SUTUN; x++) koy(x, y, R() < 0.9 ? "=" : "-", 0.75);
  for (const d of direkler) for (let y = 0; y <= raflar[raflar.length - 1]; y++)
    for (let i = 0; i < DG; i++) koy(d + i, y, i === 0 || i === DG - 1 ? "|" : ":", 0.7);
  const sutunlar = [[0, direkler[0] - 1], [direkler[0] + DG, direkler[1] - 1], [direkler[1] + DG, SUTUN - 1]];
  // en üst: tavana kesilen kitap uçları (tablodaki gibi)
  const bolmeler = [[-1, raflar[0]], ...raflar.slice(0, -1).map((y, i) => [y, raflar[i + 1]])];
  for (const [ust, alt] of bolmeler) for (const [x0, x1] of sutunlar) kutular.push({ x0, x1, ust: ust + 1, alt: alt - 1 });
  // kitaplar
  const bosluklar = [];                                  // uçan kitaplar için ayrılan boşluklar
  kutular.forEach((k, ki) => {
    const yuk = k.alt - k.ust + 1;
    let x = k.x0 + 1, konuldu = false;
    // her bölmede bir boşluk (en üstteki yarım sıra hariç): 6 kitap uçabilsin
    const bosYer = ki >= 3 ?k.x0 + 4 + Math.floor(R() * Math.max(1, k.x1 - k.x0 - 14)) : -1;
    while (x <= k.x1 - 1){
      // bir kitaplık boşluk (3 geniş + pay). "x >= bosYer": kitaplar 2-4 genişlikte atladığı için
      // tam eşitlik hiç tutmuyordu → boşluk ayrılmıyor, uçan kitap oluşmuyordu
      if (bosYer >= 0 && !konuldu && x >= bosYer && x + 5 <= k.x1){
        bosluklar.push({ x: x + 1, alt: k.alt, yuk }); konuldu = true; x += 5; continue;
      }
      if (R() < 0.06){ x += 1 + Math.floor(R() * 2); continue; }       // doğal aralık
      const gen = Math.min(k.x1 - x, 2 + Math.floor(R() * 3));
      if (gen < 2) break;
      const boy = Math.max(3, Math.round(yuk * (0.55 + R() * 0.4)));
      const b = 0.5 + R() * 0.5;
      if (R() < 0.07 && gen === 1 && x + 3 < k.x1){                     // eğik duran kitap
        for (let i = 0; i < boy - 1; i++) koy(x + Math.floor(i / 3), k.alt - i, "/", b);
        x += Math.ceil(boy / 3) + 1; continue;
      }
      kitapCiz(koy, R, x, k.alt, gen, boy, b);
      x += gen;
    }
  });
  // zemin: seyrek, soluk tahta çizgileri
  for (let y = raflar[raflar.length - 1] + 1; y < SATIR; y++)
    for (let x = 0; x < SUTUN; x++) if (R() < 0.05 + 0.02 * (y - raflar[4]) / SATIR) koy(x, y, "._-,"[Math.floor(R() * 4)], 0.35);
  return { raflar, bosluklar, kutular };
}
/* Sade sırt (ilk denemede iç doku karakter duvarı yapıyordu): iki kenar, üstte ve altta
   yaldız bandı, ortada bazen küçük bir etiket; arası BOŞ. */
function kitapCiz(koy, R, x, alt, gen, boy, b){
  const ust = alt - boy + 1, bant1 = ust + 1, bant2 = alt - 1;
  const etiket = gen >= 3 && R() < 0.5 ? ust + Math.floor(boy * 0.35) : -1;
  for (let y = ust; y <= alt; y++) for (let i = 0; i < gen; i++){
    const kenar = i === 0 || i === gen - 1;
    let k = null;
    if (y === ust) k = kenar ? "." : "_";
    else if (kenar) k = "|";
    else if (y === bant1 || y === bant2) k = "=";
    else if (y === etiket) k = "#";
    if (k) koy(x + i, y, k, b * (0.85 + R() * 0.15));
    else koy(x + i, y, " ", b);                          // boş ama "dolu": arkadaki örtülsün
  }
}

/* ── UÇAN KİTAPLAR: A→B, sonra B→A (döngü sonunda herkes yerinde) ─────────── */
function ucanlariKur(yer){
  const R = rastgele(3);
  // her uçan kitap: kaynağı bir boşlukta DURUR (başta), hedefi başka bir boşluk
  // Gökşin: "biraz daha sık uçabilir mi? hep aynı 2 kitap mı?" → 6 kitap, 12 uçuş (~12 sn'de bir).
  // Boşluklar karıştırılıp birbirinden uzak olanlar eşleniyor; kitap j, 4+12j'de gider,
  // 4+12(j+6)'da döner → döngü sonunda herkes yerinde.
  const b = yer.bosluklar.slice();
  for (let i = b.length - 1; i > 0; i--){ const j = Math.floor(R() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
  const n = Math.min(6, Math.floor(b.length / 2));
  const ciftler = Array.from({length: n}, (_, i) => [b[i], b[i + n]]);
  // [gidiş başı, dönüş başı]. Bazıları üst üste biniyor ("aynı anda 2 kitap da uçabilir").
  const GIDIS = [4, 17, 20, 38, 52, 55];
  const plan = ciftler.map((_, j) => [GIDIS[j], GIDIS[j] + 72]);
  return ciftler.map(([a, h], i) => {
    const boy = Math.max(3, Math.min(a.yuk, h.yuk) - 2 - Math.floor(R() * 2));
    const gen = 3, bb = 1;
    const o = document.createElement("canvas");
    o.width = Math.ceil(gen * cw); o.height = Math.ceil(boy * ch);
    const x = o.getContext("2d");
    x.font = yazi(); x.textBaseline = "middle"; x.textAlign = "center";
    const koy = (cx, cy, k, br) => { const v = Math.round(235 * br);
      // zemin YOK: rafta dururken diğer kitaplar gibi görünsün (kahve zemin uçarken çiziliyor)
      x.fillStyle = `rgb(${v},${v},${v})`; x.fillText(k, cx * cw + cw / 2, cy * ch + ch / 2); };
    kitapCiz(koy, R, 0, boy - 1, gen, boy, bb);
    return { o, gen, boy, a, h, git: plan[i][0], don: plan[i][1], sure: 9 };
  });
}
function ucanKonum(u, t){
  // 0..sure → A'dan B'ye yay; dönüşte tersi. Başka zamanlarda bulunduğu rafta durur.
  const tt = ((t % T) + T) % T;
  let bas = u.a, son = u.h, p = null;
  if (tt < u.git) p = 0;
  else if (tt < u.git + u.sure) p = (tt - u.git) / u.sure;
  else if (tt < u.don) p = 1;
  else if (tt < u.don + u.sure) p = 1 - (tt - u.don) / u.sure;
  else p = 0;
  const kx = (s) => s.x * cw, ky = (s) => (s.alt - u.boy + 1) * ch;
  const e = yumusak(p);
  const x = kx(bas) + (kx(son) - kx(bas)) * e;
  // önce raftan yukarı kalk, havada süzül, sonra yerine in
  const kalk = Math.sin(Math.PI * p) * (0.12 * H) + Math.sin(Math.PI * p * 3) * 0.01 * H;
  const y = ky(bas) + (ky(son) - ky(bas)) * e - kalk;
  const aci = Math.sin(Math.PI * p * 2) * 0.25 * Math.sin(Math.PI * p);   // havada hafif sallanma
  return { x, y, aci, ucuyor: p > 0 && p < 1, p };
}

/* ── ARKA PLAN bir kez çizilir ─────────────────────────────────────────── */
let YER = null;
function arkaCiz(){
  ARKA = document.createElement("canvas"); ARKA.width = W; ARKA.height = H;
  const x = ARKA.getContext("2d");
  x.font = yazi(); x.textBaseline = "middle"; x.textAlign = "center";
  izg.forEach((satir, y) => satir.forEach((h, s) => {
    if (!h) return;
    const v = Math.round(215 * h[1]);
    x.fillStyle = `rgb(${v},${v},${v})`;
    x.fillText(h[0], s * cw + cw / 2, y * ch + ch / 2);
  }));
}
function boyutlandir(){
  if (innerWidth < 50 || innerHeight < 50) return;       // arka plandayken gelen sıfır boyut: sahneyi bozmasın
  const d = Math.min(window.devicePixelRatio || 1, 2);
  W = c.width = Math.round(innerWidth * d); H = c.height = Math.round(innerHeight * d);
  ch = H / SATIR; cw = ch * 0.6; SUTUN = Math.ceil(W / cw);
  YER = kitaplikKur(); arkaCiz(); UCANLAR = ucanlariKur(YER);
}

/* ── MAGNUS: oturuyor, nefes alıyor; sayfalar ara sıra kendiliğinden dönüyor ── */
const RESIM = new Image();
let resimHazir = false, TEMIZ = null;
RESIM.onload = () => {
  // alt kenardaki açık gri gölge şeridi siyahta pus gibi duruyordu → yumuşakça sönsün
  const o = document.createElement("canvas"); o.width = 520; o.height = 315;
  const x = o.getContext("2d"); x.drawImage(RESIM, 0, 0);
  const g = x.createLinearGradient(0, 270, 0, 315);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "#000");
  x.globalCompositeOperation = "destination-out"; x.fillStyle = g; x.fillRect(0, 270, 520, 45);
  TEMIZ = o; resimHazir = true; if (DONUK !== null) ciz(DONUK);
};
RESIM.src = "gorsel/hayalet-okuyan.png";
const SIRT = [233, 162], SAG_UC = [285, 137], SOL_UC = [197, 130];   // kitap (tablo pikseli)
const SAYFALAR = [18, 44, 45.6, 77, 104, 131];                      // dönüş başlangıçları (sn)
const SAYFA_SURE = 1.4;
function magnusDurum(t){
  const olc = 0.36 * H / 315, gen = 520 * olc, boy = 315 * olc;
  const nefes = dalga(16, t);                                       // ~4.5 sn'de bir
  const sy = 1 + 0.018 * nefes, sx = 1 + 0.007 * nefes;
  const taban = 0.93 * H, orta = 0.58 * W;
  return { olc, gen, boy, sx, sy, x0: orta - gen * sx / 2, y0: taban - boy * sy };
}
function magnusCiz(t, m){
  if (!resimHazir) return;
  ctx.drawImage(TEMIZ, m.x0, m.y0, m.gen * m.sx, m.boy * m.sy);
  // dönen sayfa
  const tt = ((t % T) + T) % T;
  const s = SAYFALAR.find(b => tt >= b && tt < b + SAYFA_SURE);
  if (s === undefined) return;
  const p = yumusak((tt - s) / SAYFA_SURE), th = Math.PI * p;
  const px = (ix) => m.x0 + ix * m.olc * m.sx, py = (iy) => m.y0 + iy * m.olc * m.sy;
  const r = th < Math.PI / 2 ? SAG_UC[0] - SIRT[0] : SIRT[0] - SOL_UC[0];
  const bx = SIRT[0] + Math.cos(th) * r;
  const by = SAG_UC[1] + (SOL_UC[1] - SAG_UC[1]) * p - Math.sin(th) * 38;
  const kal = 10 * Math.abs(Math.cos(th)) + 3;                      // sayfanın görünen kalınlığı
  ctx.beginPath();
  ctx.moveTo(px(SIRT[0]), py(SIRT[1]));
  ctx.quadraticCurveTo(px((SIRT[0] + bx) / 2), py(by + 18), px(bx), py(by + kal));
  ctx.lineTo(px(bx), py(by));
  ctx.quadraticCurveTo(px((SIRT[0] + bx) / 2), py(by + 6), px(SIRT[0]), py(SIRT[1] - 10));
  ctx.closePath();
  ctx.fillStyle = "rgba(238,228,205,.95)"; ctx.fill();
  ctx.strokeStyle = "rgba(120,95,70,.6)"; ctx.lineWidth = Math.max(1, m.olc * 1.2); ctx.stroke();
}

/* ── MUM: süzülüyor; ışık onunla geziyor ─────────────────────────────────── */
function mumDurum(t){
  const x = 0.37 * W + 0.01 * W * dalga(2, t, 1), y = 0.55 * H + 0.035 * H * dalga(6, t);
  return { x, y, fx: x, fy: y - 2.6 * ch * MUM_K };                 // ışık alevden çıkar
}
const MUM_K = 1.8;                                                 // mum kendi iri karakteriyle (küçükte seçilmiyordu)
function mumCiz(t, m){
  const alev = ["(", ")", "(", "^"][Math.floor(((t * 6) % 4 + 4) % 4)];
  const sanat = [[alev, 0, -3], ["*", 0, -2], ["|", -1, -1], ["~", 0, -1], ["|", 1, -1],
                 ["|", -1, 0], ["|", 1, 0], ["|", -1, 1], ["_", 0, 1], ["|", 1, 1]];
  ctx.font = `bold ${Math.round(ch * 0.86 * MUM_K)}px Consolas, "Courier New", monospace`;
  ctx.textBaseline = "middle"; ctx.textAlign = "center";
  // alevin sıcak parıltısı
  const pr = ch * MUM_K * (2.2 + 0.3 * dalga(37, t));
  const g = ctx.createRadialGradient(m.fx, m.fy, 0, m.fx, m.fy, pr);
  g.addColorStop(0, "rgba(255,170,70,.45)"); g.addColorStop(1, "rgba(255,170,70,0)");
  ctx.globalCompositeOperation = "lighter";
  ctx.fillStyle = g; ctx.fillRect(m.fx - pr, m.fy - pr, pr * 2, pr * 2);
  ctx.globalCompositeOperation = "source-over";
  for (const [k, dx, dy] of sanat){
    ctx.fillStyle = dy <= -2 ? (dy === -3 ? "#ffcf5a" : "#ff9a3a") : "#e9dcc0";
    ctx.fillText(k, m.x + dx * cw * MUM_K, m.y + dy * ch * MUM_K);
  }
}

/* ── IŞIK: karanlık + sarı-turuncu (orman sahnesiyle aynı dil) ──────────────── */
function karanlik(m, t){
  const tit = 1 + 0.05 * dalga(37, t) + 0.03 * dalga(91, t, 1) + 0.02 * dalga(153, t, 2);
  const r = 0.75 * H * tit;                                         // ilk denemede fazla karanlıktı
  const gr = ctx.createRadialGradient(m.fx, m.fy, 0, m.fx, m.fy, r);
  gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(0.35, "rgba(0,0,0,0.1)");
  gr.addColorStop(0.7, "rgba(0,0,0,0.5)"); gr.addColorStop(1, "rgba(0,0,0,0.82)");
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = "multiply";
  const r2 = 0.5 * H * tit;
  const g = ctx.createRadialGradient(m.fx, m.fy, 0, m.fx, m.fy, r2);
  g.addColorStop(0, "rgb(255,165,60)"); g.addColorStop(0.45, "rgb(255,200,110)");
  g.addColorStop(0.8, "rgb(255,236,200)"); g.addColorStop(1, "rgb(255,255,255)");
  ctx.fillStyle = g; ctx.fillRect(m.fx - r2, m.fy - r2, r2 * 2, r2 * 2);
  ctx.globalCompositeOperation = "source-over";
}

/* ── KARE ── */
function ciz(t){
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(ARKA, 0, 0);
  // uçan kitaplar (ışıkla birlikte kararsın/turuncuya dönsün diye karanlıktan ÖNCE)
  const izler = [], ucanlar = [];
  const kitapKoy = (u, k, zeminli) => {
    ctx.save();
    ctx.translate(k.x + u.o.width / 2, k.y + u.o.height / 2); ctx.rotate(k.aci);
    // uçarken koyu kahve, yarı saydam zemin (siyahta kara blok, zeminsizde arkası karışıyordu)
    if (zeminli){ ctx.fillStyle = "rgba(48,36,26,.85)"; ctx.fillRect(-u.o.width / 2, -u.o.height / 2, u.o.width, u.o.height); }
    ctx.drawImage(u.o, -u.o.width / 2, -u.o.height / 2);
    ctx.restore();
  };
  for (const u of UCANLAR){
    const k = ucanKonum(u, t);
    if (k.ucuyor){ ucanlar.push([u, k]); izler.push([k.x + u.o.width / 2, k.y + u.o.height / 2, k.p]); }
    else kitapKoy(u, k);                                            // rafta: diğerleri gibi ışıkla kararır
  }
  const mm = mumDurum(t);
  karanlik(mm, t);
  // UÇARKEN karanlıktan SONRA: karanlık köşede de seçilsin (sihirli parıltı)
  for (const [u, k] of ucanlar){
    const cx = k.x + u.o.width / 2, cy = k.y + u.o.height / 2, hr = u.o.height * 1.3;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, hr);
    g.addColorStop(0, `rgba(255,225,160,${0.22 * Math.sin(Math.PI * k.p)})`); g.addColorStop(1, "rgba(255,225,160,0)");
    ctx.fillStyle = g; ctx.fillRect(cx - hr, cy - hr, hr * 2, hr * 2);
    kitapKoy(u, k, true);
  }
  // sihir kıvılcımları: uçan kitabın arkasında, ışıktan bağımsız parlar
  ctx.font = yazi(); ctx.textBaseline = "middle"; ctx.textAlign = "center";
  for (const [x, y, p] of izler) for (let i = 1; i <= 6; i++){
    const a = (1 - i / 7) * 0.7 * Math.sin(Math.PI * p);
    const dx = -Math.cos(p * 9 + i) * i * cw * 1.3, dy = Math.sin(p * 7 + i * 1.7) * i * ch * 0.6;
    ctx.fillStyle = `rgba(255,230,160,${a})`;
    ctx.fillText(i % 2 ? "·" : "*", x + dx, y + dy);
  }
  // toz zerrecikleri: mum ışığında yavaşça süzülen noktalar
  for (let i = 0; i < 14; i++){
    const x = mm.fx + (0.35 * H) * Math.sin(i * 2.4 + 2 * Math.PI * (1 + i % 3) * t / T);
    const y = mm.fy + (0.25 * H) * Math.cos(i * 1.3 + 2 * Math.PI * (1 + i % 2) * t / T);
    const a = 0.35 * Math.pow(Math.max(0, dalga(3 + i % 4, t, i)), 2);
    if (a < 0.02) continue;
    ctx.fillStyle = `rgba(255,225,170,${a})`; ctx.fillText("·", x, y);
  }
  magnusCiz(t, magnusDurum(t));
  mumCiz(t, mm);
}

let bas = null;
function dongu(ms){
  if (bas === null) bas = ms;
  // tek karede hata olsa bile döngü ölmesin (Gökşin: başka uygulamadan dönünce "sadece mum uçuyordu")
  try { ciz(((ms - bas) / 1000) % T); } catch (e) {}
  requestAnimationFrame(dongu);
}
// Arka plandan dönünce boyut değişmişse sahneyi yeniden kur (gizliyken gelen 0 boyutlar yok sayılıyor)
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  const d = Math.min(window.devicePixelRatio || 1, 2);
  if (c.width !== Math.round(innerWidth * d) || c.height !== Math.round(innerHeight * d)) boyutlandir();
});
boyutlandir();
addEventListener("resize", () => { boyutlandir(); if (DONUK !== null) ciz(DONUK); });
if (DONUK !== null) ciz(DONUK); else requestAnimationFrame(dongu);

/* Tam ekran, ekranın kararmaması, müzik, yağmur, pomodoro ve sahne geçişi: ortak.js */

</script>
<script src="nosleep.min.js"></script>
<script src="ortak.js?s=3"></script>
</body>
</html>

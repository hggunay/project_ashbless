<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="ikon-192.png"><link rel="apple-touch-icon" href="ikon-192.png"><meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Magnus · Yağmurlu Pencere</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;transform-origin:50% 50%}
canvas.giris{transform:scale(1.25);opacity:0}
canvas.gecis{transition:transform .9s ease-in-out,opacity .9s ease-in-out}
body.sakin{cursor:none}
</style>
</head>
<body data-sahne="pencere">
<canvas id="c" class="giris"></canvas>
<script>
/* MAGNUS — YAĞMURLU PENCERE (16 Ekim; Gökşin'in fikri: "camdaki damlaları izlemekten kendimi
   alamıyorum, hipnotize ediyor — ayrı bir video mu yapsak?").
   · Odadaki pencereye dokununca kamera cama yaklaşır ve buraya gelinir; cama İKİ KEZ dokununca
     kamera uzaklaşır, odaya dönülür (oda.html?pencereden=1). Sahne düğmesiyle de gelinir.
   · Bütün ekran cam; ekranın biçimi neyse cam o biçimde çizilir (kırpma/boşluk yok).
   · Damlalar YARIŞIR: yağmur cama küçük damlalar bırakır; damlalar değince birleşir (orta boylar buğu
     toplayıp yavaşça da büyür), ağırlaşan
     damla kayar, yolundakileri toplayıp hızlanır, arkasında ince iz bırakır; ara ara duraklar.
   · Dışarısı: bulanık gece ışıkları (bokeh), çapraz yağmur ("\", odadaki gibi), seyrek şimşek.
     Hava karlıysa (veya ?kar=1) kar taneleri, köşelerde kırağı, şimşek yok.
   · Ortadaki ahşap kayıt (+) opak: damlalar onun arkasında kalır, kayda gelen damla kaybolur.
   · YAZ GECESİ (16 Ekim, Gökşin seçenek 1): Haziran–Ağustos'ta hava açıksa (kod 0–3 ya da bilinmiyorsa)
     cam kuru ve berrak: titreşen yıldızlar, hilal, kayan yıldız, seyrek kuyruklu yıldız, uydular (bazen
     Dünya'nın gölgesine girip söner), kırmızı ışığı yanıp sönen uçaklar (farklı hızda; bazen uyduyla
     paralel gidip geçer, bazen çapraz kesişir), çok seyrek Starlink treni, ateş böcekleri, yapraklı dallar.
     Gökşin: "her uydu boydan boya izlenmiyor" → bazıları gökte BELİRİP biraz gidip söner. Çok nadiren
     bir UFO gelir: cama yaklaşır, bir süre durup bakınır (gözleri sağa sola), sonra fırlayıp gider.
     ?yaz → zorla yaz · ?yagmur → yazın da yağmur · ?yaz&hepsi → hepsi aynı anda (resim için).
   · Test: ?t=SANİYE → o kadar saniye benzetilip dondurulur (tohumlu, her seferinde aynı). */
const P = new URLSearchParams(location.search);
const DONUK = P.has("t") ? parseFloat(P.get("t")) : null;
const KAR_KODLARI = [71, 73, 75, 77, 85, 86];
let KAR = P.has("kar");
if (!KAR && DONUK === null){
  try { KAR = KAR_KODLARI.includes(parseInt(localStorage.getItem("lastWeatherCode"))); } catch (e) {}
}
const YAZ_KODLARI = [0, 1, 2, 3];                                       // açık / az bulutlu
let YAZ = P.has("yaz");
if (!YAZ && !KAR && DONUK === null && !P.has("yagmur")){
  try {
    const ay = new Date().getMonth(), k = localStorage.getItem("lastWeatherCode");
    YAZ = ay >= 5 && ay <= 7 && (k === null || YAZ_KODLARI.includes(parseInt(k)));
  } catch (e) {}
}
if (YAZ){ KAR = false; document.title = "Magnus · Yaz Gecesi"; }
function rastgele(tohum){ return () => { tohum |= 0; tohum = tohum + 0x6D2B79F5 | 0;
  let x = Math.imul(tohum ^ tohum >>> 15, 1 | tohum); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x;
  return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
const R = DONUK !== null ? rastgele(2026) : Math.random;

const c = document.getElementById("c"), ctx = c.getContext("2d");
let W, H, d, ch, cw, K = null;                      // K: kayıt + çerçeve ölçüleri (piksel)
const yazi = (k = 1) => `bold ${Math.round(ch * 0.86 * k)}px Consolas, "Courier New", monospace`;

let damlalar = [], ISIKLAR = [], YILDIZLAR = [], simsekSonraki = 50, simsekBas = -99;
function boyutlandir(){
  if (innerWidth < 50 || innerHeight < 50) return;
  d = Math.min(window.devicePixelRatio || 1, 2);
  W = c.width = Math.round(innerWidth * d); H = c.height = Math.round(innerHeight * d);
  // satır yüksekliği: küçük ekranda da damlalar seçilsin (en az 13 css px), büyükte ~56 satır
  ch = Math.max(13 * d, Math.min(H / 56, W / 40)); cw = ch * 0.6;
  const cer = ch * 1.3;                                                  // dış çerçeve kalınlığı
  K = { cer, kx: W / 2, ky: H / 2, kw: cw * 2.2, kh: ch * 1.6 };
  // bokeh: uzak, bulanık sokak lambaları / pencereler (ekrana göre yeniden dağılır)
  const RB = rastgele(41);
  ISIKLAR = Array.from({ length: Math.round(8 + W * H / (260000 * d * d)) }, () => ({
    x: RB() * W, y: H * (0.25 + RB() * 0.7), r: (40 + RB() * 110) * d,
    renk: RB() < 0.6 ? [255, 190, 110] : RB() < 0.5 ? [255, 236, 200] : [140, 200, 220],
    a: 0.14 + RB() * 0.2, faz: RB() * 6.28, hiz: 0.15 + RB() * 0.3 }));
  damlalar = damlalar.filter(a => a.x < W && a.y < H);
  // yaz: sabit yıldızlar (gökyüzünün üst kısmında daha sık)
  const RY = rastgele(77);
  YILDIZLAR = Array.from({ length: Math.round(70 + 110 * W * H / (1366 * 640 * d * d)) }, () => {
    const p = RY();
    return { x: RY() * W, y: Math.pow(RY(), 1.5) * H * 0.8, k: p < 0.72 ? "." : p < 0.93 ? "+" : "*",
             a: p < 0.72 ? 0.35 + RY() * 0.35 : 0.6 + RY() * 0.35, faz: RY() * 6.28, hiz: 0.6 + RY() * 2.2,
             renk: RY() < 0.15 ? "255,226,190" : RY() < 0.2 ? "190,210,255" : "240,244,255" };
  });
  dallariKur();
}

/* ── DIŞARIDAKİ AĞAÇ DALLARI (16 Ekim, Gökşin: "arka plana sallanan bulanık ağaç dalları").
   Bir kez küçük çözünürlükte çizilir (büyütülünce kendiliğinden bulanıklaşır), her karede yalnız
   kökünün çevresinde hafifçe döndürülür. Karda üst kenarlarında kar birikir. */
let DALLAR = [];
function dalCiz(g, x, y, aci, boy, kal, RD, derin, parcalar){
  const nx = x + Math.cos(aci) * boy, ny = y + Math.sin(aci) * boy;
  const mx = (x + nx) / 2 + (RD() - 0.5) * boy * 0.3, my = (y + ny) / 2 + (RD() - 0.5) * boy * 0.3;
  parcalar.push([x, y, mx, my, nx, ny, kal, aci]);
  if (derin <= 0 || kal < 0.8) return;
  const n = RD() < 0.45 ? 3 : 2;
  for (let i = 0; i < n; i++){
    const yeniAci = aci + (i - (n - 1) / 2) * 0.55 + (RD() - 0.5) * 0.5 + 0.08;   // + uçlar hafif sarkar
    dalCiz(g, nx, ny, yeniAci, boy * (0.6 + RD() * 0.22), kal * 0.64, RD, derin - 1, parcalar);
  }
}
function dallariKur(){
  const s = 0.25, olcu = Math.min(W, H) * 0.34 + Math.max(W, H) * 0.06;
  const kokler = [{ px: -W * 0.03, py: H * 0.1, aci: 0.18, boy: olcu },
                  { px: W * 1.03, py: H * 0.42, aci: Math.PI - 0.32, boy: olcu * 0.9 }];
  DALLAR = kokler.map((k, i) => {
    const oc = document.createElement("canvas"); oc.width = Math.ceil(W * s); oc.height = Math.ceil(H * s);
    const g = oc.getContext("2d"); g.scale(s, s); g.lineCap = "round";
    try { g.filter = `blur(${Math.max(1, ch * s * 0.35)}px)`; } catch (e) {}
    const parcalar = [], RD = rastgele(70 + i);
    dalCiz(g, k.px, k.py, k.aci, k.boy, ch * 1.1, RD, W > H * 1.4 ? 5 : 6, parcalar);
    const yol = (p, oy) => { g.beginPath(); g.moveTo(p[0], p[1] + oy); g.quadraticCurveTo(p[2], p[3] + oy, p[4], p[5] + oy); g.stroke(); };
    // sokak lambasının vurduğu alt kenar (sıcak, soluk), sonra gövde
    g.strokeStyle = "rgba(120,92,64,.45)";
    for (const p of parcalar){ g.lineWidth = p[6] * 1.25; yol(p, p[6] * 0.2); }
    g.strokeStyle = "rgb(20,19,26)";
    for (const p of parcalar){ g.lineWidth = p[6]; yol(p, 0); }
    if (YAZ){                                                           // yaz: uçlarda yaprak kümeleri
      const RL = rastgele(90 + i);
      for (const p of parcalar) if (p[6] < ch * 0.5){
        for (let j = 0; j < 3; j++){
          const u = 0.3 + RL() * 0.7, lx = p[0] + (p[4] - p[0]) * u + (RL() - 0.5) * ch * 1.6, ly = p[1] + (p[5] - p[1]) * u + (RL() - 0.5) * ch * 1.6;
          g.fillStyle = RL() < 0.3 ? "rgba(70,72,40,.5)" : "rgb(16,24,20)";
          g.beginPath(); g.ellipse(lx, ly, ch * (0.45 + RL() * 0.5), ch * (0.3 + RL() * 0.3), RL() * 3.14, 0, 6.28); g.fill();
        }
      }
    }
    if (KAR){
      g.strokeStyle = "rgba(228,234,246,.5)";
      for (const p of parcalar) if (Math.abs(Math.sin(p[7])) < 0.6){ g.lineWidth = p[6] * 0.45; yol(p, -p[6] * 0.5); }
    }
    return { oc, px: k.px, py: k.py, faz: i * 2.3 };
  });
}

/* ── CAM ALANI: çerçevenin içi, kaydın dışı ── */
function camda(x, y, pay = 0){
  const { cer, kx, ky, kw, kh } = K;
  if (x < cer + pay || x > W - cer - pay || y < cer + pay || y > H - cer - pay) return false;
  if (Math.abs(x - kx) < kw / 2 + pay || Math.abs(y - ky) < kh / 2 + pay) return false;
  return true;
}
const KAY = 0.8, DUR = 0.6;                                             // kaymaya başlama / durma kütlesi
const yaricap = m => ch * 0.24 * (0.7 + 0.55 * Math.sqrt(m));          // görünen boyla aynı (yazi ölçeği)

/* ── YAZ GECESİ GÖKYÜZÜ ──
   Her nesne ekranı bir uçtan öbürüne geçer: (cx, cy) gökte bir nokta, açı yön; ilerleme 0→1.
   Gökşin'in gözlemi: uydu ve uçak aynı anda geçebilir; uçağın kırmızı ışığı yanıp söner, hızı farklıdır;
   bazen bir süre paralel gidip biri ötekini geçer, bazen uydu söner, bazen yönleri çaprazdır. */
let GOK = [], gokSonraki = null;
function gecis(aci, sure, cx, cy){
  const L = Math.hypot(W, H) / 2 + ch * 4, dx = Math.cos(aci), dy = Math.sin(aci);
  if (cx === undefined){ cx = W * (0.15 + R() * 0.7); cy = H * (0.1 + R() * 0.45); }
  return { x0: cx - dx * L, y0: cy - dy * L, dx: dx * 2 * L, dy: dy * 2 * L, sure, yas: 0, aci, cx, cy };
}
function gokEkle(tur, ilk = 0){
  let o;
  if (tur === "uydu"){
    o = gecis(R() * 6.28, 35 + R() * 25);
    const z = R();
    if (z < 0.4){ o.cikar = 0.2 + R() * 0.3; o.soner = o.cikar + 0.12 + R() * 0.25; }   // gökte belirir, biraz gidip söner
    else if (z < 0.65) o.soner = 0.35 + R() * 0.4;                      // Dünya'nın gölgesine girer
  } else if (tur === "ucak"){
    const uydu = GOK.find(g => g.tur === "uydu" && g.yas / g.sure < 0.5);
    if (uydu && R() < 0.5){                                             // uyduyla neredeyse paralel, farklı hız
      const kay = (R() < 0.5 ? -1 : 1) * ch * (2 + R() * 4);
      o = gecis(uydu.aci + (R() - 0.5) * 0.12, uydu.sure * (R() < 0.5 ? 0.7 : 1.45),
                uydu.cx - Math.sin(uydu.aci) * kay, uydu.cy + Math.cos(uydu.aci) * kay);
    } else o = gecis(R() * 6.28, 45 + R() * 50);
    o.faz = R();
  } else if (tur === "kayan"){
    o = gecis(0.35 + R() * 2.4, 0.5 + R() * 0.5);                       // çoğunlukla aşağı doğru
    o.boy = ch * (5 + R() * 6);
  } else if (tur === "kuyruklu"){
    o = gecis(R() < 0.5 ? 0.15 + R() * 0.3 : Math.PI - 0.15 - R() * 0.3, 70 + R() * 30, W * (0.25 + R() * 0.5), H * (0.12 + R() * 0.2));
    o.kuyruk = o.aci + Math.PI + (R() - 0.5) * 0.6;                     // kuyruk geldiği yöne doğru
  } else if (tur === "tren"){
    o = gecis(R() * 6.28, 30 + R() * 12);
    o.n = 18 + Math.floor(R() * 8); o.ara = ch * (1.1 + R() * 0.5);
    o.hiz = Math.hypot(o.dx, o.dy) / o.sure; o.sure += o.n * o.ara / o.hiz;   // son nokta da geçsin
  } else if (tur === "ufo"){
    const sag = R() < 0.5;
    o = { sure: 17.5, x: W * (sag ? 0.62 + R() * 0.2 : 0.18 + R() * 0.2), y: H * (0.22 + R() * 0.2),
          gx: W * (sag ? 0.95 : 0.05), gy: H * 0.04, cikis: sag ? 1 : -1 };
  } else if (tur === "bocek"){
    o = { x: W * R(), y: H * (0.6 + R() * 0.32), vx: 0, vy: 0, faz: R() * 10, periyot: 2.5 + R() * 3, sure: 1e9, yas: 0 };
  }
  o.tur = tur; o.yas = o.sure * ilk; GOK.push(o);
  if (tur === "ufo" && !ilk && DONUK === null && window.magnusUfoSesi) window.magnusUfoSesi();
}
const ARALIK = { kayan: [25, 90], uydu: [40, 110], ucak: [50, 130], tren: [360, 720], kuyruklu: [420, 900], ufo: [1500, 3000] };
function gokAdim(dt, t){
  if (gokSonraki === null){
    gokSonraki = { kayan: t + 8, uydu: t + 3, ucak: t + 20, tren: t + 150, kuyruklu: t + 240, ufo: t + 600 + R() * 900 };
    if (P.has("ufo") && DONUK === null) gokSonraki.ufo = 50;           // ?ufo: açılıştan 20 sn sonra (ses açılabilsin)
    for (let i = 0; i < 10; i++) gokEkle("bocek");
  }
  // resim / deneme için hepsi birden — açılıştaki 30 sn'lik ön benzetim BİTTİKTEN sonra (Gökşin: "10 dk izledim
  // UFO gelmedi, kuyruklu yıldızla başlıyor": ön benzetimde eklenenler ekranı görmeden geçip gidiyordu)
  if (P.has("hepsi") && !gokSonraki.hepsi && (DONUK === null ? t >= 30 : t >= DONUK - 0.05)){
    gokSonraki.hepsi = true;
    ["uydu", "kuyruklu", "tren"].forEach(k => gokEkle(k, 0.45)); gokEkle("ucak", 0.4); gokEkle("kayan", 0.5);
    if (DONUK !== null) gokEkle("ufo", 0.45);
  }
  for (const k in ARALIK) if (t > gokSonraki[k]){
    gokEkle(k); const [a, b] = ARALIK[k]; gokSonraki[k] = t + a + R() * (b - a);
  }
  for (const o of GOK){
    o.yas += dt;
    if (o.tur === "bocek"){                                             // ağır, kıvrak uçuş
      o.vx += (R() - 0.5) * ch * 3 * dt; o.vy += (R() - 0.5) * ch * 3 * dt;
      o.vx *= 0.97; o.vy *= 0.97; o.x += o.vx * dt; o.y += o.vy * dt;
      if (o.y < H * 0.55) o.vy += ch * dt; if (o.y > H * 0.95) o.vy -= ch * dt;
      if (o.x < 0) o.x += W; if (o.x > W) o.x -= W;
    }
  }
  GOK = GOK.filter(o => o.yas < o.sure);
}
const konum = (o, p) => [o.x0 + o.dx * p, o.y0 + o.dy * p];
function isik(x, y, r, renk, a){                                         // küçük parlayan nokta
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 4);
  g.addColorStop(0, `rgba(${renk},${a})`); g.addColorStop(0.25, `rgba(${renk},${a * 0.6})`); g.addColorStop(1, `rgba(${renk},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - r * 4, y - r * 4, r * 8, r * 8);
}
function gokCiz(t){
  // yıldızlar
  ctx.font = yazi(0.8);
  for (const Y of YILDIZLAR){
    const a = Y.a * (0.55 + 0.45 * Math.sin(t * Y.hiz + Y.faz) * Math.sin(t * Y.hiz * 0.37 + Y.faz * 2));
    hk(Y.x, Y.y, Y.k, `rgba(${Y.renk},${Math.max(0.08, a)})`);
  }
  // hilal (sağ üst camda)
  const mx = W * 0.8, my = H * 0.17, mr = ch * 1.5;
  const hl = ctx.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 5);
  hl.addColorStop(0, "rgba(255,240,200,.16)"); hl.addColorStop(1, "rgba(255,240,200,0)");
  ctx.fillStyle = hl; ctx.fillRect(mx - mr * 5, my - mr * 5, mr * 10, mr * 10);
  ctx.fillStyle = "rgba(255,238,196,.92)"; ctx.beginPath();
  ctx.arc(mx, my, mr, -Math.PI / 2, Math.PI / 2); ctx.ellipse(mx, my, mr * 0.45, mr, 0, Math.PI / 2, -Math.PI / 2, true); ctx.fill();
  for (const o of GOK){
    const p = o.yas / o.sure;
    if (o.tur === "uydu"){
      let a = 0.85;
      if (o.cikar !== undefined) a *= Math.max(0, Math.min(1, (p - o.cikar) * o.sure / 2.5));   // yavaşça belirir
      if (o.soner && p > o.soner) a *= Math.max(0, 1 - (p - o.soner) * o.sure / 3);   // 3 sn'de söner
      const [x, y] = konum(o, p); if (a > 0.01) isik(x, y, d * 1.2, "235,240,255", a);
    } else if (o.tur === "ucak"){
      const [x, y] = konum(o, p), f = (o.yas + o.faz) % 1.2;
      isik(x, y, d * 1.3, "245,245,235", 0.8);                          // sabit beyaz
      if (f < 0.18) isik(x + d * 4, y + d * 2, d * 1.6, "255,60,50", 1); // kırmızı yanıp söner
      if ((o.yas + o.faz * 2) % 1.6 < 0.06) isik(x - d * 3, y, d * 1.8, "255,255,255", 1);   // beyaz çakar
    } else if (o.tur === "kayan"){
      const [x, y] = konum(o, p), a = Math.sin(Math.PI * p);
      const ex = x - Math.cos(o.aci) * o.boy, ey = y - Math.sin(o.aci) * o.boy;
      const g = ctx.createLinearGradient(x, y, ex, ey);
      g.addColorStop(0, `rgba(255,255,240,${a})`); g.addColorStop(1, "rgba(255,255,240,0)");
      ctx.strokeStyle = g; ctx.lineWidth = d * 1.6; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(ex, ey); ctx.stroke();
    } else if (o.tur === "kuyruklu"){
      const [x, y] = konum(o, p), a = Math.min(1, Math.sin(Math.PI * p) * 2.5), boy = ch * 9;
      for (let j = 0; j < 7; j++){                                      // yelpaze kuyruk
        const ka = o.kuyruk + (j - 3) * 0.035, ex = x + Math.cos(ka) * boy * (1 - Math.abs(j - 3) * 0.12), ey = y + Math.sin(ka) * boy * (1 - Math.abs(j - 3) * 0.12);
        const g = ctx.createLinearGradient(x, y, ex, ey);
        g.addColorStop(0, `rgba(200,225,255,${0.22 * a})`); g.addColorStop(1, "rgba(200,225,255,0)");
        ctx.strokeStyle = g; ctx.lineWidth = d * 2.2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(ex, ey); ctx.stroke();
      }
      isik(x, y, d * 2.2, "230,245,255", 0.9 * a);
    } else if (o.tur === "tren"){
      const yol = o.yas * o.hiz;
      const ux = Math.cos(o.aci), uy = Math.sin(o.aci);
      for (let j = 0; j < o.n; j++){
        const s = yol - j * o.ara; if (s < 0) break;
        isik(o.x0 + ux * s, o.y0 + uy * s, d * 1, "235,240,255", 0.75 - (j % 3) * 0.08);
      }
    }
  }
}
/* UFO (ses dosyasıyla eş: uğultu 14,5. sn'de tepe yapıp kesilir): gelir (4 sn, uzaktan büyüyerek), bakınır (10,5 sn, hafif sallanır, gözleri sağa sola, ışıkları döner),
   fırlar gider (yaklaşık 2 sn, hızlanıp küçülerek). Dallardan önde, çerçevenin arkasında. */
function ufoCiz(t){
  for (const o of GOK) if (o.tur === "ufo"){
    const y = o.yas; let k, x, yy, a = Math.min(1, y);
    if (y < 4){ const u = 1 - Math.pow(1 - y / 4, 3); k = 0.2 + 0.8 * u; x = o.gx + (o.x - o.gx) * u; yy = o.gy + (o.y - o.gy) * u; }
    else if (y < 14.5){ k = 1; x = o.x + Math.sin((y - 4) * 0.8) * ch * 0.7; yy = o.y + Math.sin((y - 4) * 1.7) * ch * 0.3; }
    else { const u = Math.min(1, (y - 14.5) / 2); k = Math.max(0.05, 1 - 0.9 * u); x = o.x + o.cikis * u * u * W * 0.9; yy = o.y - u * u * H * 0.6; a = 1 - u * 0.3; }
    const S = k * 2.1, sw = cw * S * 0.86, sh = ch * S;     // sw ≈ bir harf genişliği
    // altında hafif yeşil ışık
    const g = ctx.createRadialGradient(x, yy + sh, 0, x, yy + sh, sh * 3);
    g.addColorStop(0, `rgba(140,255,190,${0.18 * a})`); g.addColorStop(1, "rgba(140,255,190,0)");
    ctx.fillStyle = g; ctx.fillRect(x - sh * 3, yy - sh * 2, sh * 6, sh * 6);
    ctx.font = yazi(S);
    hk(x, yy - sh * 1.1, ".-~~~-.", `rgba(150,230,200,${0.85 * a})`);    // cam kubbe
    hk(x, yy - sh * 0.55, "(       )", `rgba(150,230,200,${0.85 * a})`);
    hk(x, yy, "(=============)", `rgba(185,195,205,${a})`);               // gövde
    hk(x, yy + sh * 0.5, "'-.......-'", `rgba(150,160,170,${0.9 * a})`);
    // gözler: bakınırken sağa sola
    const bak = y > 4 && y < 14.5 ? Math.sin((y - 4) * 1.1) * sw * 1.2 : 0;
    const kirp = (y > 7 && y < 7.15) || (y > 11.5 && y < 11.65);
    hk(x - sw * 1.2 + bak, yy - sh * 0.55, kirp ? "-" : "o", `rgba(120,255,140,${a})`);
    hk(x + sw * 1.2 + bak, yy - sh * 0.55, kirp ? "-" : "o", `rgba(120,255,140,${a})`);
    // gövdedeki dönen ışıklar
    const renkler = ["255,90,90", "255,220,90", "110,220,255"];
    for (let j = -3; j <= 3; j++){
      const r = renkler[(j + 3 + Math.floor(t * 6)) % 3];
      hk(x + j * sw * 2, yy, "o", `rgba(${r},${a})`);
    }
  }
}
function bocekCiz(t){
  for (const o of GOK) if (o.tur === "bocek"){
    const f = ((t + o.faz) % o.periyot) / o.periyot, a = f < 0.3 ? Math.sin(f / 0.3 * Math.PI) : 0;
    if (a > 0.02) isik(o.x, o.y, d * 1.8, "210,255,120", 0.85 * a);
  }
}

/* ── DAMLA BENZETİMİ ──
   m: kütle. m < 1 durur; m ≥ 1 kayar (hız kütleyle artar), yolundaki damlaları yutar,
   arkasında küçük iz damlaları bırakır (kütle kaybeder), m < 0.85 olunca yine durur. */
function damlaEkle(x, y, m){ damlalar.push({ x, y, m, kay: false, faz: R() * 6.28, yas: 0, iz: 0, sol: 0 }); }
function adim(dt, t){
  // yağmur cama vurur (karda daha seyrek: eriyen taneler)
  const alanOran = (W * H) / (1366 * 640 * d * d);
  let yeni = YAZ ? 0 : dt * (KAR ? 9 : 26) * alanOran;
  if (YAZ) gokAdim(dt, t);
  while (yeni > 0){
    if (R() < yeni){
      const x = R() * W, y = R() * H;
      // çoğu çiseleme zerresi, bir kısmı küçük, azı orta damla (orta damlalar yarışı başlatır)
      const z = R(), m = z < 0.6 ? 0.05 + R() * 0.12 : z < 0.92 ? 0.2 + R() * 0.3 : 0.5 + R() * 0.35;
      if (camda(x, y, ch * 0.4)) damlaEkle(x, y, m);
    }
    yeni -= 1;
  }
  // kayanlar
  for (const a of damlalar){
    a.yas += dt;
    if (a.kay){
      // dur-kalk: gerçek camdaki gibi bazen yavaşlar, bazen atılır
      const dalga = Math.max(0.05, 0.55 + 0.6 * Math.sin(t * 1.7 + a.faz) + 0.35 * Math.sin(t * 4.1 + a.faz * 2));
      const hiz = ch * (1.2 + 3.2 * (a.m - KAY)) * dalga;
      a.y += hiz * dt;
      a.x += Math.sin(t * 0.9 + a.faz) * ch * 0.08 * dt + a.sol * dt;
      if (R() < dt * 0.4) a.sol = (R() - 0.5) * ch * 0.6;               // ara ara yana sapar
      a.iz += hiz * dt;
      if (a.iz > ch * 0.5){                                             // iz damlası
        a.iz = 0; a.m -= 0.025;
        damlalar.push({ x: a.x + (R() - 0.5) * ch * 0.1, y: a.y - yaricap(a.m) * 1.2, m: 0.05, kay: false, faz: 0, yas: 0, iz: 0, sol: 0, izDamla: true });
      }
      if (a.m < DUR) a.kay = false;
      if (!camda(a.x, a.y)) a.sil = true;                               // kayda / çerçeveye geldi
    } else {
      if (a.m >= KAY) a.kay = true;
      else if (a.m > 0.35 && !a.izDamla) a.m += dt * 0.006;            // buğu toplayıp yavaşça büyür
    }
  }
  // birleşme: ızgara ile yalnız KOMŞU damlalar karşılaştırılır (izlerle 1000+ damla olabiliyor;
  // her çifti denemek tablette takılıyordu)
  const hucre = ch * 1.2, izgara = new Map(), anahtar = (i, j) => i * 100000 + j;
  for (const b of damlalar){
    const k = anahtar(Math.floor(b.x / hucre), Math.floor(b.y / hucre));
    let l = izgara.get(k); if (!l) izgara.set(k, l = []); l.push(b);
  }
  for (const a of damlalar){
    if (a.sil || a.izDamla) continue;
    const gi = Math.floor(a.x / hucre), gj = Math.floor(a.y / hucre);
    for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++){
      const l = izgara.get(anahtar(gi + di, gj + dj)); if (!l) continue;
      for (const b of l){
        if (b === a || b.sil || a.sil || b.izDamla && a.kay && b.y < a.y) continue;   // kendi izini yutmasın
        if (!a.kay && !b.izDamla && !b.kay && b.m > a.m) continue;   // durgun çiftte iri olan yutar (bir kez)
        const ra = yaricap(a.m), rb = yaricap(b.m), dx = a.x - b.x, dy = a.y - b.y;
        if (dx * dx + dy * dy < (ra + rb) * (ra + rb) * 0.8){
          const [buyuk, kucuk] = a.m >= b.m || a.kay ? [a, b] : [b, a];
          buyuk.m += kucuk.m * (kucuk.izDamla ? 0.5 : 1); kucuk.sil = true;
          if (!buyuk.kay && buyuk.m >= KAY) buyuk.kay = true;
        }
      }
    }
  }
  // iz damlaları solar; çok kalabalıksa en eski küçükler buharlaşır
  for (const a of damlalar) if (a.izDamla && a.yas > 7) a.sil = true;
  damlalar = damlalar.filter(a => !a.sil);
  const tavan = Math.round(380 * alanOran);
  if (damlalar.length > tavan){
    let fazla = damlalar.length - tavan;
    for (const a of damlalar){ if (fazla <= 0) break; if (!a.kay && !a.izDamla && a.m < 0.2){ a.sil = true; fazla--; } }   // izler kendi solar
    damlalar = damlalar.filter(a => !a.sil);
  }
  // şimşek zamanlaması
  if (!KAR && !YAZ && t > simsekSonraki){
    simsekBas = t; simsekSonraki = t + 55 + R() * 70;
    if (DONUK === null && window.magnusGokSesi) window.magnusGokSesi();
  }
}
const simsekMi = t => !KAR && !YAZ && ((t - simsekBas >= 0 && t - simsekBas < 0.12) || (t - simsekBas >= 0.3 && t - simsekBas < 0.42));

/* ── ÇİZİM ── */
function hk(x, y, k, renk){ ctx.fillStyle = renk; ctx.fillText(k, x, y); }
function ciz(t){
  const sm = simsekMi(t);
  // gece göğü (çakarken açık mavi)
  const g = ctx.createLinearGradient(0, 0, 0, H);
  if (sm){ g.addColorStop(0, "rgb(120,136,190)"); g.addColorStop(1, "rgb(70,84,128)"); }
  else if (YAZ){ g.addColorStop(0, "rgb(5,9,26)"); g.addColorStop(1, "rgb(20,26,46)"); }
  else { g.addColorStop(0, "rgb(8,11,22)"); g.addColorStop(1, "rgb(16,20,34)"); }
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = "middle"; ctx.textAlign = "center";
  if (YAZ) gokCiz(t);
  // bokeh
  if (!sm) for (const L of ISIKLAR){
    const a = L.a * (0.8 + 0.2 * Math.sin(t * L.hiz + L.faz)), x = L.x + Math.sin(t * 0.05 + L.faz) * 8 * d;
    const gr = ctx.createRadialGradient(x, L.y, 0, x, L.y, L.r);
    gr.addColorStop(0, `rgba(${L.renk},${a})`); gr.addColorStop(0.6, `rgba(${L.renk},${a * 0.35})`); gr.addColorStop(1, `rgba(${L.renk},0)`);
    ctx.fillStyle = gr; ctx.fillRect(x - L.r, L.y - L.r, L.r * 2, L.r * 2);
  }
  // uzaktaki şimşek: iki çakmada iki yarı (odadaki gibi), gökyüzünün üst yarısında
  if (sm){
    const ikinci = t - simsekBas >= 0.3, RS = rastgele(Math.floor(simsekBas * 10));
    let x = W * (0.2 + RS() * 0.6), y = 0;
    ctx.font = yazi(1.6); ctx.save(); ctx.shadowColor = "rgba(200,220,255,1)"; ctx.shadowBlur = 24;
    const adimlar = 14;
    for (let i = 0; i < adimlar; i++){
      const nx = x + (RS() - 0.4) * cw * 5, ny = y + H * 0.045;
      if ((i < adimlar / 2) !== ikinci){
        const n = 4, kr = Math.abs(nx - x) < cw * 1.2 ? "|" : nx > x ? "\\" : "/";
        for (let j = 0; j <= n; j++) hk(x + (nx - x) * j / n, y + (ny - y) * j / n, kr, "rgb(255,252,225)");
      }
      x = nx; y = ny;
    }
    ctx.restore();
  }
  // ağaç dalları: rüzgârda yavaşça sallanır (şimşekte siyah siluet)
  for (const D of DALLAR){
    const a = 0.028 * Math.sin(t * 0.42 + D.faz) + 0.01 * Math.sin(t * 1.3 + D.faz * 3);
    ctx.save(); ctx.translate(D.px, D.py); ctx.rotate(a); ctx.translate(-D.px, -D.py);
    if (sm) ctx.filter = "brightness(0.15)";
    ctx.drawImage(D.oc, 0, 0, W, H); ctx.restore();
  }
  // dışarıdaki yağmur ya da kar (camın arkasında, bulanık)
  const R2 = rastgele(9);
  ctx.font = yazi(1.1);
  if (YAZ){ bocekCiz(t); ufoCiz(t); }
  else if (KAR){
    for (let i = 0; i < 140; i++){
      const hiz = 0.4 + R2() * 0.8, x0 = R2() * W, faz = R2() * 100;
      const y = ((t * hiz * ch + faz * ch) % (H + ch * 2)) - ch, x = x0 + Math.sin(t * 0.6 + faz) * cw * 2;
      hk(x, y, R2() < 0.5 ? "*" : ".", `rgba(235,240,250,${0.3 + R2() * 0.4})`);
    }
  } else {
    const n = Math.round(90 * (W * H) / (1366 * 640 * d * d));
    for (let i = 0; i < n; i++){
      const hiz = 14 + R2() * 8, faz = R2() * 1000, pg = W + H * 0.4;
      const y = ((t * hiz * ch + faz * ch) % (H + ch * 4)) - ch * 2;
      const x = ((R2() * pg + y * 0.35) % pg) - H * 0.2;
      hk(x, y, "\\", sm ? "rgba(215,228,252,.5)" : `rgba(150,175,215,${0.18 + R2() * 0.2})`);
    }
  }
  // camın iç yüzü: hafif buğu
  ctx.fillStyle = "rgba(160,180,210,.035)"; ctx.fillRect(0, 0, W, H);
  // kırağı (karda, köşelerden)
  if (KAR){
    const RK = rastgele(13); ctx.font = yazi(0.9);
    for (let i = 0; i < 260; i++){
      const kose = i % 4, u = Math.pow(RK(), 1.8) * Math.min(W, H) * 0.32, a = RK() * Math.PI / 2;
      const x = kose % 2 ? W - u * Math.cos(a) : u * Math.cos(a), y = kose < 2 ? u * Math.sin(a) : H - u * Math.sin(a);
      hk(x, y, RK() < 0.4 ? "*" : RK() < 0.5 ? "·" : "'", `rgba(225,235,248,${0.55 - u / (Math.min(W, H) * 0.7)})`);
    }
  }
  // damlalar
  for (const a of damlalar){
    if (a.izDamla){
      ctx.font = yazi(0.7);
      hk(a.x, a.y, a.yas < 3 ? ":" : "'", `rgba(205,224,248,${Math.max(0, 0.6 - a.yas * 0.08)})`);
      continue;
    }
    const k = Math.min(2.4, 0.7 + 0.55 * Math.sqrt(a.m));
    ctx.font = yazi(k);
    const kr = a.m < 0.3 ? "." : a.m < 0.75 ? "o" : "O";
    const al = Math.min(0.95, 0.45 + a.m * 0.4);
    hk(a.x, a.y, kr, sm ? "#fff" : `rgba(215,232,255,${al})`);
    if (a.m > 0.75){                                                    // iri damlada parıltı
      ctx.font = yazi(k * 0.45);
      hk(a.x - cw * k * 0.12, a.y - ch * k * 0.14, "'", "rgba(255,255,255,.8)");
    }
  }
  // AHŞAP ÇERÇEVE + KAYIT (opak, odadaki tonlarla)
  const { cer, kx, ky, kw, kh } = K, kr = "rgb(196,140,88)";
  ctx.fillStyle = "rgb(92,62,38)";
  ctx.fillRect(0, 0, W, cer); ctx.fillRect(0, H - cer, W, cer); ctx.fillRect(0, 0, cer, H); ctx.fillRect(W - cer, 0, cer, H);
  ctx.fillRect(kx - kw / 2, 0, kw, H); ctx.fillRect(0, ky - kh / 2, W, kh);
  ctx.font = yazi();
  for (let y = ch / 2; y < H; y += ch){
    hk(kx - cw * 0.4, y, "|", kr); hk(kx + cw * 0.4, y, "|", kr);
    hk(cer * 0.45, y, "|", kr); hk(W - cer * 0.45, y, "|", kr);
  }
  for (let x = cw / 2; x < W; x += cw){
    hk(x, ky - ch * 0.22, "=", kr); hk(x, ky + ch * 0.22, "=", kr);
    hk(x, cer * 0.5, "=", kr); hk(x, H - cer * 0.5, "=", kr);
  }
  hk(kx, ky, "#", "rgb(230,180,120)");
  [[cer * 0.45, cer * 0.5], [W - cer * 0.45, cer * 0.5], [cer * 0.45, H - cer * 0.5], [W - cer * 0.45, H - cer * 0.5]].forEach(([x, y]) => hk(x, y, "#", "rgb(230,180,120)"));
  if (KAR){                                                             // yatay kaydın üstünde kar
    ctx.font = yazi();
    for (let x = cer + cw / 2; x < W - cer; x += cw) if (Math.abs(x - kx) > kw / 2) hk(x, ky - kh / 2 - ch * 0.3, (Math.round(x / cw) * 7) % 5 ? "~" : "^", "rgba(240,244,252,.95)");
  }
  if (sm){ ctx.fillStyle = "rgba(200,210,255,.08)"; ctx.fillRect(0, 0, W, H); }
}

/* ── DÖNGÜ ── */
boyutlandir();
addEventListener("resize", () => { boyutlandir(); if (DONUK !== null) ciz(DONUK); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") boyutlandir(); });
let son = null, zaman = 0;
if (DONUK !== null){
  for (let s = 0; s < DONUK; s += 1 / 30){ zaman = s; adim(1 / 30, s); }
  zaman = DONUK; ciz(DONUK); c.classList.remove("giris");
  if (P.has("say")){ ctx.font = yazi(1.4); ctx.textAlign = "left"; hk(60, 60, `kayan ${damlalar.filter(a => a.kay).length} · toplam ${damlalar.length} · en iri ${Math.max(...damlalar.map(a => a.m)).toFixed(2)}`, "#ff0"); }
} else {
  // ilk açılışta cam boş kalmasın: 30 sn önceden, iri adımlarla benzetilir (açılış beklemesin)
  for (let s = 0; s < 30; s += 0.1) adim(0.1, s);
  zaman = 30;
  requestAnimationFrame(function dongu(ms){
    if (son !== null) { const dt = Math.min(0.05, (ms - son) / 1000); zaman += dt; try { adim(dt, zaman); } catch (e) {} }
    son = ms;
    try { ciz(zaman); } catch (e) {}
    requestAnimationFrame(dongu);
  });
  // girişte kamera cama yaklaşıyormuş gibi
  requestAnimationFrame(() => requestAnimationFrame(() => { c.classList.add("gecis"); c.classList.remove("giris"); }));
}

/* ── ODAYA DÖNÜŞ: cama iki kez dokun (tek dokunuş şeridi gösterir) ── */
let sonDokunma = 0, donuyor = false;
c.addEventListener("pointerdown", () => {
  const simdi = performance.now();
  if (simdi - sonDokunma < 420 && !donuyor){
    donuyor = true;
    c.classList.add("gecis"); c.style.transform = "scale(.3)"; c.style.opacity = "0";
    setTimeout(() => { if (window.magnusSahneGit) window.magnusSahneGit("oda.html?pencereden=1"); else location.href = "oda.html?pencereden=1"; }, 850);
  }
  sonDokunma = simdi;
});
addEventListener("pageshow", e => {
  if (!e.persisted) return;
  c.style.transform = ""; c.style.opacity = ""; donuyor = false;
});
// ilk gelişte bir kez nasıl dönüleceğini söyle
setTimeout(() => {
  try {
    if (localStorage.getItem("magnus-pencere-ipucu")) return;
    localStorage.setItem("magnus-pencere-ipucu", "1");
  } catch (e) { return; }
  if (window.magnusMesaj) window.magnusMesaj("Odaya dönmek için cama iki kez dokun.");
}, 2500);

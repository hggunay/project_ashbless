<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="ikon-192.png"><link rel="apple-touch-icon" href="ikon-192.png"><meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Magnus · Oda</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
body.sakin{cursor:none}
</style>
</head>
<body data-sahne="oda">
<canvas id="c"></canvas>
<script>
/* MAGNUS — ASCII ODA (25 Eylül gecesi; Gökşin'in fikri, tasarım onaylı).
   Ortada şömine (ışık kaynağı, piksel-ateş), sol üstte pencere (yağmur, sallanan dal, seyrek
   şimşek), şöminenin sağında sallanan sandalyede kitap okuyan ASCII Magnus (görsel yok → ASCII,
   krem; ışıkla BOYANMAZ), yanında sehpa + buharı tüten çay, halıda uyuyan KARA KEDİ (Gökşin'in
   kara kedileri), raf: kitaplar + GERÇEK SAATİ gösteren saat + sarkan bitki, duvarda eski dünya
   haritası ("koltuk seyyahı"). Müzik/sesler/pomodoro: ortak.js. Deneme: ?t=20 donmuş kare. */
const T = 144, T_KUCUK = 72;
const SATIR = Math.max(50, Math.min(72, Math.round(innerHeight / 12)));
const c = document.getElementById("c"), ctx = c.getContext("2d");
const P = new URLSearchParams(location.search);
const DONUK = P.has("t") ? parseFloat(P.get("t")) : null;
/* KAR (15 Ekim, Gökşin'in fikri): hava kar yağışlıysa pencere manzarası karlı. Ashbless açılınca
   hava kodunu localStorage 'lastWeatherCode'a yazıyor (aynı site → Magnus da okur); Magnus kendisi
   de aynı yolla (ipapi → open-meteo, izin istemez) tazeler. Test: adrese ?kar=1. */
const KAR_KODLARI = [71, 73, 75, 77, 85, 86];
let KAR = P.has("kar");
if (!KAR && DONUK === null){
  try { KAR = KAR_KODLARI.includes(parseInt(localStorage.getItem("lastWeatherCode"))); } catch (e) {}
  fetch("https://ipapi.co/json/").then(r => r.json())
    .then(l => l.latitude && l.longitude && fetch(`https://api.open-meteo.com/v1/forecast?latitude=${l.latitude}&longitude=${l.longitude}&current=weather_code&timezone=auto`))
    .then(r => r && r.json())
    .then(d => { const k = d && d.current && d.current.weather_code; if (k === undefined) return;
      try { localStorage.setItem("lastWeatherCode", k); } catch (e) {}
      KAR = KAR_KODLARI.includes(k); })
    .catch(() => {});
}
const dalga = (k, t, faz = 0) => Math.sin(2 * Math.PI * k * t / T_KUCUK + faz);
function rastgele(tohum){ return () => { tohum |= 0; tohum = tohum + 0x6D2B79F5 | 0;
  let x = Math.imul(tohum ^ tohum >>> 15, 1 | tohum); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x;
  return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

let W, H, cw, ch, SUTUN, ARKA = null, L = null;
const yazi = (k = 1) => `${Math.round(ch * 0.86 * k)}px Consolas, "Courier New", monospace`;

const BUYUK = 1.3;                                     // Magnus + sehpa büyütme katsayısı (en çok)
/* ── YERLEŞİM (hücre) ── */
function yerlesim(){
  const X = f => Math.round(f * SUTUN), Y = f => Math.round(f * SATIR);
  // şömine biraz solda ve dar: sehpa + Magnus'a yer kalsın (1366×640'ta sehpa şömineye değiyordu)
  // 14 Ekim: yatay ekranda şömine 0.43 → 0.40 (büyüyen sehpaya yer). Dikeyde 0.43 kalır:
  // orada yer zaten dar, Magnus büyümüyor; sola kayınca raf pencereye giriyordu.
  const fx = X(W > H ? 0.40 : 0.43);
  const mx = X(0.80);
  /* BÜYÜKLÜK (14 Ekim, Gökşin: "Magnus küçük kaldı, ana karakter göze görünmüyor; sehpa da
     ona oranla büyüsün"). Magnus + sandalye + sehpa + buhar aynı katsayıyla büyür. Dar
     (dikey) ekranda sandalye sağ kenardan taşmasın diye küçülür (arkalık ~10,5 sütun sağda). */
  // Sehpa şömineye de değmesin: sol kenarı mx − 35K, şöminenin sağı fx + 0.12 SUTUN (+2 boşluk).
  const K = Math.max(1, Math.min(BUYUK, (SUTUN - mx - 1) / 10.5, (mx - fx - X(0.12) - 2) / 35));
  return {
    K,
    duvarAlt: Y(0.74),                                     // duvar/zemin sınırı
    somine: { x0: fx - X(0.12), x1: fx + X(0.12), ust: Y(0.42), alt: Y(0.80), cx: fx },
    ates:   { x0: fx - X(0.07), x1: fx + X(0.07), ust: Y(0.53), alt: Y(0.78) },
    // 14 Ekim: biraz sola (0.05–0.24 → 0.04–0.22): sağdaki perde şöminenin rafına değmesin
    pencere:{ x0: X(0.04), x1: X(0.22), ust: Y(0.10), alt: Y(0.44) },
    // portre (eskiden harita): DİKEY, rafın yanında ve daha aşağıda (Gökşin'in çizimi)
    harita: { x0: X(0.645), x1: X(0.775), ust: Y(0.13), alt: Y(0.47) },
    magnus: { x: mx, y: Y(0.93) },                         // sallanma merkezi: kızak ortası
    // sehpa Magnus'a BAĞLI: kucağının (~14 sütun solu) hemen solunda, her ekran oranında
    sehpa:  { x: mx - Math.round(25 * K), y: Y(0.92) },    // ayak uçları; tabla 7×K satır yukarıda
    kedi:   { x: X(0.25), y: Y(0.91) },
    // kedinin oyuncak sepeti: pencerenin altında, yerde, duvara yaslı (taban orta)
    sepet:  { x: Math.round((X(0.04) + X(0.22)) / 2), y: Y(0.74) + 3 },
    saat:   { x: fx, y: Y(0.42) - 6 },                 // kadran merkezi (kasa 8 satır, rafın üstünde)
  };
}

/* ── ARKA PLAN (bir kez çizilir): duvar, zemin, şömine, raf, harita, pencere çerçevesi, halı ── */
function arkaKur(){
  const R = rastgele(5), g = Array.from({ length: SATIR }, () => Array(SUTUN).fill(null));
  const koy = (x, y, k, b) => { x = Math.round(x); y = Math.round(y);
    if (x >= 0 && x < SUTUN && y >= 0 && y < SATIR) g[y][x] = [k, b]; };
  const yazS = (x, y, s, b) => [...s].forEach((k, i) => k !== " " && koy(x + i, y, k, b));
  // duvar kâğıdı: seyrek, çok soluk desen
  for (let y = 0; y < L.duvarAlt; y++) for (let x = 0; x < SUTUN; x++)
    if ((x % 7 === 3 && y % 3 === 1) || R() < 0.012) koy(x, y, R() < 0.5 ? "." : ":", 0.22);
  // süpürgelik + zemin tahtaları
  for (let x = 0; x < SUTUN; x++){ koy(x, L.duvarAlt, "=", 0.55); koy(x, L.duvarAlt + 1, "_", 0.4); }
  for (let y = L.duvarAlt + 2; y < SATIR; y++) for (let x = 0; x < SUTUN; x++){
    if ((y - L.duvarAlt) % 3 === 0) koy(x, y, "_", 0.28);
    else if ((x + y * 11) % 17 === 0) koy(x, y, "|", 0.22);
  }
  // halı (şöminenin önü): çerçeveli oval, içinde desen
  const hx = L.somine.cx, hy = Math.round((L.duvarAlt + SATIR) / 2) + 1, rx = Math.round(SUTUN * 0.2), ry = Math.round((SATIR - L.duvarAlt) * 0.34);
  for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++){
    const d = (x * x) / (rx * rx) + (y * y) / (ry * ry);
    if (d > 1) continue;
    if (d > 0.82) koy(hx + x, hy + y, "o", 0.45);
    else if (d > 0.62 && d < 0.7) koy(hx + x, hy + y, "~", 0.35);
    else if ((x + y * 3) % 6 === 0) koy(hx + x, hy + y, "*", 0.28);
    else koy(hx + x, hy + y, " ", 0);
  }
  // ŞÖMİNE: taş çerçeve (tuğla deseni), içi boş (ateş ayrı çizilir)
  const S = L.somine, A = L.ates;
  for (let y = S.ust; y <= S.alt; y++) for (let x = S.x0; x <= S.x1; x++){
    const ic = x >= A.x0 && x <= A.x1 && y >= A.ust && y <= A.alt;
    if (ic) continue;
    const tugla = (y % 2 === 0) ? (x % 4 === 0 ? "|" : "_") : ((x + 2) % 4 === 0 ? "|" : "_");
    koy(x, y, tugla, 0.55 + R() * 0.15);
  }
  // ocak kemeri + ocak tabanı + odunlar
  for (let x = A.x0 - 1; x <= A.x1 + 1; x++) koy(x, A.ust - 1, x === A.x0 - 1 ? "/" : x === A.x1 + 1 ? "\\" : "-", 0.7);
  for (let y = A.ust; y <= A.alt; y++){ koy(A.x0 - 1, y, "[", 0.7); koy(A.x1 + 1, y, "]", 0.7); }
  const odun = A.alt, ox = Math.round((A.x0 + A.x1) / 2);
  yazS(ox - 7, odun, "(==o==)(==o==)", 0.75);
  yazS(S.x0 - 2, S.alt + 1, "=".repeat(S.x1 - S.x0 + 5), 0.7);          // ocak taşı
  // RAF (şömine üstü)
  const rafY = S.ust - 1;
  for (let x = S.x0 - 3; x <= S.x1 + 3; x++){ koy(x, rafY, "=", 0.8); koy(x, rafY + 1, "-", 0.5); }
  // raftaki kitaplar (sol)
  let bx = S.x0 - 1;
  for (const [gen, boy] of [[2, 5], [3, 6], [2, 4], [3, 5]]){
    for (let y = 0; y < boy; y++) for (let i = 0; i < gen; i++){
      const k = y === 0 ? (i === 0 || i === gen - 1 ? "." : "_") : (i === 0 || i === gen - 1 ? "|" : (y === 1 || y === boy - 2 ? "=" : " "));
      koy(bx + i, rafY - 1 - (boy - 1) + y, k, 0.75);
    }
    bx += gen;
  }
  yazS(bx + 1, rafY - 1, "[=====]", 0.7);                               // yatık kitap
  // saksı + YUKARI açılan uzun yapraklı bitki (Gökşin: sarkan dallar hiç dikkat çekmiyordu)
  const px = S.x1 - 5;
  [ "\\   |   /",
    " \\  |  / ",
    "\\ \\ | / /",
    " \\ \\|/ / ",
    "  \\\\|// ",
    "   \\|/   ",
    "  (___)  ",
    "   \\_/   " ].forEach((s, i, a) => yazS(px - 1, rafY - a.length + i, s, i < 6 ? 0.7 : 0.8));
  // SAAT: büyük, üstü KEMERLİ şömine saati, düz taban (Gökşin'in çizimi). Akrep/yelkovan her karede.
  const sx = L.saat.x, sy = L.saat.y;
  [ "   .-~~~~~-.   ",
    "  /   12    \\  ",                     // 15 Ekim: 12 bir boşluk sağa (sola kayık duruyordu)
    " /           \\ ",
    "| 9    .    3 |",                     // 15 Ekim: 3 ve 9 bir boşluk içeride (kasa çizgisine yapışıktı)
    "|             |",
    " \\     6     / ",
    "  |_________|  ",
    " [___________] " ].forEach((s, i) => yazS(sx - 7, sy - 3 + i, s, i < 6 ? 0.85 : 0.75));
  // PENCERE çerçevesi (içi her karede)
  const Pn = L.pencere;
  /* 14 Ekim (Gökşin: "çerçeveyi belirginleştir, ortaya + şeklinde kayıt"): ÇİFT çerçeve, köşelerde #.
     Ortadaki + kayıt camın ÜSTÜNE pencereCiz'de çiziliyor — eskiden burada çiziliyordu ve
     camın koyu dolgusu onu neredeyse tamamen örtüyordu. Perde de ayrı (perdeCiz, sallanıyor). */
  for (let x = Pn.x0 - 1; x <= Pn.x1 + 1; x++){ koy(x, Pn.ust - 1, "=", 0.95); koy(x, Pn.alt + 1, "=", 0.95); }
  for (let x = Pn.x0; x <= Pn.x1; x++){ koy(x, Pn.ust, "-", 0.8); koy(x, Pn.alt, "-", 0.8); }
  for (let y = Pn.ust; y <= Pn.alt; y++){ koy(Pn.x0 - 1, y, "|", 0.95); koy(Pn.x1 + 1, y, "|", 0.95); koy(Pn.x0, y, "|", 0.8); koy(Pn.x1, y, "|", 0.8); }
  [[Pn.x0 - 1, Pn.ust - 1], [Pn.x1 + 1, Pn.ust - 1], [Pn.x0 - 1, Pn.alt + 1], [Pn.x1 + 1, Pn.alt + 1]].forEach(([x, y]) => koy(x, y, "#", 1));
  for (let x = Pn.x0 - 2; x <= Pn.x1 + 2; x++) koy(x, Pn.alt + 2, "~", 0.5);          // pervaz gölgesi
  // PORTRE: Magnus ve kedisi (Gökşin: haritanın harita olduğu belli değildi). Çift çerçeve.
  const M = L.harita;
  for (let x = M.x0; x <= M.x1; x++){ koy(x, M.ust, "=", 0.75); koy(x, M.alt, "=", 0.75); }
  for (let y = M.ust; y <= M.alt; y++){ koy(M.x0, y, "|", 0.75); koy(M.x1, y, "|", 0.75); koy(M.x0 + 1, y, ":", 0.4); koy(M.x1 - 1, y, ":", 0.4); }
  [[M.x0, M.ust], [M.x1, M.ust], [M.x0, M.alt], [M.x1, M.alt]].forEach(([x, y]) => koy(x, y, "#", 0.85));
  // ayakta uzun Magnus (tablolarındaki örtü) + yanında oturan, bıyıklı kedi; aynı taban çizgisi
  const portre = [
    "   .-~~-.            ",
    "  /      \\           ",
    " |  O  O  |          ",
    " |        |          ",
    " |        |          ",
    " |        |          ",
    " |        |   /\\_/\\  ",
    " |        | =( o.o )=",
    " |        |   ) ^ (  ",
    " |        |  /     \\ ",
    " |        | (       )",
    " |        | |  | |  |",
    " /        \\ |  | |  |",
    "/_/\\_/\\_/\\_\\ \\_|_|_/~",
  ];
  const pw = portre[0].length, pcx2 = Math.round((M.x0 + M.x1) / 2), pcy2 = Math.round((M.ust + M.alt) / 2);
  portre.forEach((s, i) => yazS(pcx2 - Math.floor(pw / 2), pcy2 - Math.floor(portre.length / 2) + i, s, 0.78));
  // SEHPA: büyük, yüksek, Magnus'un solunda; üstünde kitaplar + tabaklı fincan (Gökşin'in çizimi).
  // Sh.y = zemin (ayak ucu); tabla 7 satır yukarıda. Buhar her karede fincanın üstünden.
  const Sh = L.sehpa, K = L.K;
  // kitaplar ve tabak TABLANIN hemen üstünde (Gökşin: "kitaplar havada duruyor" — 2 satır yüksekteydi)
  const SEHPA = [ "                     ",
    "            .----.   ",
    " [=====]   (      )] ",
    "[=======]   `----'   ",
    "[=======] ~~~~~~~~~~ ",
    "=====================",
    " ||               || ",
    " ||               || ",
    " ||               || ",
    " ||               || ",
    " ||               || ",
    "_||_             _||_" ];
  /* Sehpa K kat büyük çizildiği için ızgaraya değil, ızgaranın ÜSTÜNE ayrı yazılır (aşağıda).
     Izgarada yalnız altında kalanlar silinir:
     · tabla ve üstü (kitap, fincan): satırın dolu kısmının tamamı — arkadaki süpürgelik (====)
       fincanın, kitapların arasından görünüyordu
     · ayaklar: YALNIZ ayak karakterlerinin altı — 14 Ekim, Gökşin: "halının ucu sehpanın altına
       girmeli ama sehpanın altında halı kesiliyor" (ayak satırlarındaki boşluklar halıyı siliyordu) */
  const sx0 = Sh.x * cw + cw / 2, sy0 = Sh.y * ch + ch / 2;            // dayanak: sağ-sol orta, en alt satır
  const sehpaX = j => sx0 + (j - 10) * cw * K, sehpaY = i => sy0 - (SEHPA.length - 1 - i) * ch * K;
  const sil = (x0, x1, y0, y1) => {
    for (let y = Math.ceil(y0 / ch - 0.5); y <= Math.floor(y1 / ch - 0.5); y++)
      for (let x = Math.ceil(x0 / cw - 0.5); x <= Math.floor(x1 / cw - 0.5); x++)
        if (y >= 0 && y < SATIR && x >= 0 && x < SUTUN) g[y][x] = null;
  };
  SEHPA.forEach((s, i) => {
    const ilk = s.search(/\S/), son = s.length - [...s].reverse().join("").search(/\S/) - 1;
    if (ilk < 0) return;
    const y = sehpaY(i), yy = ch * K / 2;
    if (i <= 5) sil(sehpaX(ilk) - cw * K / 2, sehpaX(son) + cw * K / 2, y - yy, y + yy);
    else for (let j = ilk; j <= son; j++) if (s[j] !== " ") sil(sehpaX(j) - cw * K / 2, sehpaX(j) + cw * K / 2, y - yy, y + yy);
  });
  // çiz
  ARKA = document.createElement("canvas"); ARKA.width = W; ARKA.height = H;
  const x = ARKA.getContext("2d");
  // KALIN yazı (26 Eylül, 2. tur): ince çizgiler Gökşin'in cihazlarında sönük kalıyordu — yalnız
  // parlaklık artışı fark edilmedi. Magnus ve kedi zaten kalın, onlar seçiliyordu.
  x.font = `bold ${yazi()}`; x.textBaseline = "middle"; x.textAlign = "center";
  g.forEach((satir, y) => satir.forEach((h, s) => {
    if (!h || !h[1]) return;
    // Gökşin (26 Eylül): "oda çok belli belirsiz, gündüz/telefonda neredeyse boş" → 220 → 330 (tavan 255)
    const v = Math.min(255, Math.round(330 * h[1]));
    x.fillStyle = `rgb(${v},${v},${v})`;
    x.fillText(h[0], s * cw + cw / 2, y * ch + ch / 2);
  }));
  // SEHPA (K kat): ızgaradaki aynı parlaklıklarla
  x.font = `bold ${yazi(K)}`;
  SEHPA.forEach((s, i) => [...s].forEach((k, j) => {
    if (k === " ") return;
    const v = Math.min(255, Math.round(330 * (i < 5 ? 0.8 : 0.7)));
    x.fillStyle = `rgb(${v},${v},${v})`;
    x.fillText(k, sehpaX(j), sehpaY(i));
  }));
}

/* ── hücreye tek karakter (canlı parçalar için) ── */
function hk(x, y, k, renk){
  ctx.fillStyle = renk;
  ctx.fillText(k, x * cw + cw / 2, y * ch + ch / 2);
}

/* ── ATEŞ: "piksel ateş" — alt sıra hep sıcak, ısı yukarı taşınırken rastgele soğur ve
   yana kayar → dalgalanan alevler. Isı 0..36; karakter ve renk ısıya göre. ── */
let ISI = null, ATES_W = 0, ATES_H = 0, atesSon = 0;
const ATES_K = " ..,:;+*%#@@";
function atesKur(){
  ATES_W = L.ates.x1 - L.ates.x0 + 1; ATES_H = L.ates.alt - L.ates.ust;   // en alt sıra odunlar
  ISI = new Uint8Array(ATES_W * ATES_H);
  for (let x = 0; x < ATES_W; x++) ISI[(ATES_H - 1) * ATES_W + x] = 36;
  atesSon = 0;                        // yeniden boyutlanınca ateş baştan ısınsın (donuk karede boş kalıyordu)
}
function atesAdim(){
  for (let y = 1; y < ATES_H; y++) for (let x = 0; x < ATES_W; x++){
    const kaynak = ISI[y * ATES_W + x], r = Math.floor(Math.random() * 3);
    const hedefX = Math.min(ATES_W - 1, Math.max(0, x - r + 1));
    // soğuma kutu boyuna göre: alev kutunun ~2/3'üne uzansın (ilk ayarda kutuyu dolduruyordu)
    const sogu = Math.floor(Math.random() * (36 / ATES_H) * 1.9);
    ISI[(y - 1) * ATES_W + hedefX] = Math.max(0, kaynak - sogu);
  }
  // alt sıra nabız atsın: kenarlar soğuk, ortada yer yer sıcak dilli (alev dilleri buradan)
  for (let x = 0; x < ATES_W; x++){
    const kenar = Math.min(x, ATES_W - 1 - x) / (ATES_W / 2);
    ISI[(ATES_H - 1) * ATES_W + x] = Math.round((18 + 18 * Math.min(1, kenar * 1.4)) * (0.75 + Math.random() * 0.25));
  }
}
function atesRenk(v){
  const u = v / 36;
  if (u < 0.3) return `rgba(150,40,15,${u * 2.4})`;
  if (u < 0.55) return `rgb(220,${Math.round(70 + u * 60)},25)`;
  if (u < 0.8) return `rgb(255,${Math.round(120 + u * 90)},50)`;
  return "rgb(255,236,170)";
}
function atesCiz(t){
  if (!ISI) return;
  // ⚠️ t her 144 sn'de başa döner: dönüşte fark eksiye düşüp ateş DONUYORDU (Gökşin: "ara sıra
  // şömine hareketi duruyor") → t geriye gittiyse sayacı da geri al
  if (t < atesSon) atesSon = t;
  if (DONUK === null && t - atesSon > 0.06){ atesAdim(); atesSon = t; }  // ~16 kare/sn yeter
  if (DONUK !== null && atesSon === 0){ for (let i = 0; i < 40; i++) atesAdim(); atesSon = 1; }
  ctx.font = `bold ${yazi()}`;
  for (let y = 0; y < ATES_H; y++) for (let x = 0; x < ATES_W; x++){
    const v = ISI[y * ATES_W + x]; if (v < 3) continue;
    hk(L.ates.x0 + x, L.ates.ust + y, ATES_K[Math.min(ATES_K.length - 1, Math.floor(v / 36 * (ATES_K.length - 1)))], atesRenk(v));
  }
  // ateşin kendi parıltısı
  const fx = L.somine.cx * cw, fy = (L.ates.ust + ATES_H * 0.6) * ch, pr = ATES_H * ch * (1.1 + 0.08 * dalga(37, t));
  const g = ctx.createRadialGradient(fx, fy, 0, fx, fy, pr);
  g.addColorStop(0, "rgba(255,140,40,.35)"); g.addColorStop(1, "rgba(255,140,40,0)");
  ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = g; ctx.fillRect(fx - pr, fy - pr, pr * 2, pr * 2);
  ctx.globalCompositeOperation = "source-over";
}

/* ── PENCERE: gece, çapraz yağmur, sallanan dal, seyrek şimşek ── */
const SIMSEK = [[70, 70.12], [70.3, 70.42]];                            // T içinde (sn)
const simsekMi = t => !KAR && SIMSEK.some(([a, b]) => t % T >= a && t % T < b);   // karda şimşek yok
function pencereCiz(t){
  const Pn = L.pencere, sm = simsekMi(t);
  const x0 = (Pn.x0 + 1) * cw, y0 = (Pn.ust + 1) * ch, w = (Pn.x1 - Pn.x0 - 1) * cw, h = (Pn.alt - Pn.ust - 1) * ch;
  // çakarken cam açık mavi (zikzak üstünde parlasın), normalde gece laciverdi
  ctx.fillStyle = sm ? "rgba(88,104,158,.9)" : "rgba(10,14,26,.9)"; ctx.fillRect(x0, y0, w, h);
  ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, w, h); ctx.clip();
  ctx.font = yazi();
  /* DALLAR (Gökşin: "daha fazla ve yapraklı"): üç dal, farklı kenarlardan uzanıyor, her biri
     kendi temposunda sallanıyor; boyunca ve ucunda yaprak kümeleri. */
  const dallar = [
    { x: Pn.x1 - 1, y: Pn.ust + 2, yon: -1, boy: 16, egim: 0.30, k: 5, faz: 0 },
    { x: Pn.x0 + 1, y: Pn.ust + 5, yon:  1, boy: 12, egim: 0.18, k: 7, faz: 1.7 },
    { x: Pn.x1 - 1, y: Pn.ust + 11, yon: -1, boy: 10, egim: -0.12, k: 6, faz: 3.1 },
  ];
  // karda yaprak kümeleri yerine dallarda kar
  const yaprakRenk = sm ? "#fff" : KAR ? "rgba(232,238,250,.9)" : "rgba(125,145,120,.85)", dalRenk = sm ? "#fff" : "rgba(115,105,95,.85)";
  const RY = rastgele(41);
  for (const d of dallar){
    const sal = 0.10 * dalga(d.k, t, d.faz) + 0.04 * dalga(d.k * 3, t, d.faz + 1);
    for (let i = 0; i <= d.boy; i++){
      const u = i / d.boy, bx = d.x + d.yon * i * 0.9;
      const by = d.y + i * d.egim + Math.sin(sal * 6 + u) * u * 2.4;
      hk(bx, by, d.egim > 0.15 ? (d.yon < 0 ? "/" : "\\") : "-", dalRenk);
      if (i % 2 === 0 && i > 2){                                    // yaprak kümeleri dal boyunca
        for (let j = 0; j < 3; j++) hk(bx + (RY() - 0.5) * 2.5, by + (RY() < 0.5 ? -1 : 1) * (0.6 + RY()), "&%*"[j], yaprakRenk);
      }
    }
    const ux = d.x + d.yon * d.boy * 0.9, uy = d.y + d.boy * d.egim + Math.sin(sal * 6 + 1) * 2.4;
    for (let j = 0; j < 7; j++) hk(ux + (RY() - 0.5) * 4, uy + (RY() - 0.5) * 2.5, "&%*&"[j % 4], yaprakRenk);   // uçta dolgun küme
  }
  /* ŞİMŞEK (15 Ekim, Gökşin): iki çakmada; ilkinde zikzağın ÜST yarısı, ikincisinde ALT yarısı.
     Sol üstten sağ ortaya iner. Kaydın (+) arkasında kalır (kayıt sonra çiziliyor). */
  const si = KAR ? -1 : SIMSEK.findIndex(([a, b]) => t % T >= a && t % T < b);
  if (si >= 0){
    const pw = Pn.x1 - Pn.x0, ph = Pn.alt - Pn.ust;
    const YOL = [[[0.06, 0.03], [0.28, 0.18], [0.22, 0.24], [0.50, 0.36]],
                 [[0.50, 0.36], [0.42, 0.46], [0.70, 0.55], [0.64, 0.60], [0.96, 0.66]]][si];
    ctx.save(); ctx.font = `bold ${yazi(1.25)}`; ctx.shadowColor = "rgba(200,220,255,1)"; ctx.shadowBlur = 18;
    for (let k = 0; k < YOL.length - 1; k++){
      const [ax, ay] = YOL[k], [bx2, by2] = YOL[k + 1];
      const x0 = Pn.x0 + ax * pw, y0 = Pn.ust + ay * ph, x1 = Pn.x0 + bx2 * pw, y1 = Pn.ust + by2 * ph;
      const dx = x1 - x0, dy = y1 - y0, n = Math.max(2, Math.ceil(Math.hypot(dx * 0.6, dy) * 2));
      const egim = dy / (Math.abs(dx) * 0.6 + 1e-6);                     // hücre en/boy farkı hesaba katılır
      const kr = Math.abs(egim) > 2.2 ? "|" : Math.abs(egim) < 0.22 ? "-" : (dx > 0) === (dy > 0) ? "\\" : "/";
      for (let j = 0; j <= n; j++) hk(x0 + dx * j / n, y0 + dy * j / n, kr, "rgb(255,255,245)");
    }
    ctx.restore();
  }
  if (KAR) karManzara(t); else {
  /* yağmur çizgileri — 15 Ekim (Gökşin): yönü şimşekle aynı (sol üstten sağ alta "\"), daha sık
     ve belirgin. Eskiden "/" ile sağdan sola yağıyordu. */
  const R = rastgele(9), pg = Pn.x1 - Pn.x0 + 8;
  ctx.font = `bold ${yazi()}`;
  for (let i = 0; i < 40; i++){
    const hiz = 10 + R() * 6, yy = ((t * hiz + R() * 100) % (Pn.alt - Pn.ust + 4)) + Pn.ust - 2;
    const xx = Pn.x0 - 6 + ((R() * pg + (yy - Pn.ust) * 0.35) % pg);    // sağa kayarken taşan, soldan girer
    hk(xx, yy, "\\", sm ? "#fff" : "rgba(175,195,230,.8)");
  }
  /* CAMDAN SÜZÜLEN DAMLALAR: camın iç yüzünde yavaşça (ara ara durup) inen damlalar, arkalarında
     ince iz. Her damla kendi temposunda; alta varınca yukarıda yeniden belirir. */
  /* 15 Ekim (Gökşin): damla kayda (+) gelince kaybolur, kendi BÖLMESİNİN üstünden yeniden başlar —
     kaydın üstünden geçince "evin içinde" gibi duruyordu. Dikey kayda da denk gelmez. */
  const RD = rastgele(77), kx = Math.round((Pn.x0 + Pn.x1) / 2), ky = Math.round((Pn.ust + Pn.alt) / 2);
  for (let i = 0; i < 8; i++){                                          // her bölmeye ikişer
    const sol = i % 2 === 0, bx0 = sol ? Pn.x0 + 1.5 : kx + 1.5, bx1 = sol ? kx - 1.5 : Pn.x1 - 1.5;
    const ustte = Math.floor(i / 2) % 2 === 0, ust = ustte ? Pn.ust + 1 : ky + 1.2, alt = ustte ? ky - 1.2 : Pn.alt - 1;
    const dx = bx0 + RD() * (bx1 - bx0), hiz = 0.25 + RD() * 0.35, faz = RD() * 50;
    const boy = alt - ust, ilerle = t * hiz + faz;
    const dur = Math.floor(ilerle) + Math.min(1, (ilerle % 1) * 2.2);  // her birimde yarı yol kayar, sonra bekler
    const dy = ust + (dur * 0.9) % boy;
    for (let k = 1; k <= 2; k++) if (dy - k * 0.8 >= ust) hk(dx, dy - k * 0.8, k === 1 ? ":" : "'", `rgba(200,220,245,${0.45 - k * 0.15})`);   // iz de bölmede kalır
    hk(dx, dy, "o", sm ? "#fff" : "rgba(215,232,255,.9)");
  }
  }                                                                       // (yağmur sonu)
  ctx.restore();
  // + KAYIT: camın üstünde, ahşap (ışıkla boyanmaz: ateşten sonra çiziliyor → sıcak ton elle)
  const pcx = Math.round((Pn.x0 + Pn.x1) / 2), pcy = Math.round((Pn.ust + Pn.alt) / 2), kr = "rgb(196,140,88)";
  ctx.font = `bold ${yazi()}`;
  // 15 Ekim (Gökşin: "+ biraz daha kalın"): dikey kayıt iki çizgi, yatay kayıt iki sıra
  // OPAK kayıt (15 Ekim, Gökşin): önce ahşap zemin → yağmur, damla, kar hep ARKASINDA kalır
  ctx.fillStyle = "rgb(92,62,38)";
  ctx.fillRect((pcx - 0.45) * cw, (Pn.ust + 0.5) * ch, 1.9 * cw, (Pn.alt - Pn.ust - 1) * ch);
  ctx.fillRect((Pn.x0 + 0.5) * cw, (pcy - 0.25) * ch, (Pn.x1 - Pn.x0 - 1) * cw, 1.5 * ch);
  for (let y = Pn.ust + 1; y < Pn.alt; y++){ hk(pcx - 0.22, y, "|", kr); hk(pcx + 0.22, y, "|", kr); }
  for (let x = Pn.x0 + 1; x < Pn.x1; x++){ hk(x, pcy - 0.2, "=", kr); hk(x, pcy + 0.2, "=", kr); }
  hk(pcx, pcy, "#", "rgb(230,180,120)");
  if (KAR)                                                                // yatay kaydın üstünde biriken kar
    for (let x = Pn.x0 + 1; x < Pn.x1; x++) hk(x, pcy - 0.85, (x * 7) % 5 ? "~" : "^", "rgba(240,244,252,.95)");
}

/* ── KARLI MANZARA (15 Ekim): yağmur + damlaların yerine. pencereCiz'in cam kırpmasının İÇİNDE
   çağrılır. Lapa lapa kar, alt bölmelerde kar yığını, sol alt bölmede kardan adam, köşelerde kırağı. ── */
function karManzara(t){
  const Pn = L.pencere, kx = Math.round((Pn.x0 + Pn.x1) / 2), ky = Math.round((Pn.ust + Pn.alt) / 2);
  ctx.font = `bold ${yazi()}`;
  // kırağı: dört köşede seyrek buz kristalleri
  const RK = rastgele(23);
  for (let i = 0; i < 46; i++){
    const kose = i % 4, d = Math.pow(RK(), 1.8) * 5, a = RK() * Math.PI / 2;
    const x = kose % 2 ? Pn.x1 - 1 - Math.cos(a) * d * 1.6 : Pn.x0 + 1 + Math.cos(a) * d * 1.6;
    const y = kose < 2 ? Pn.ust + 1 + Math.sin(a) * d : Pn.alt - 1 - Math.sin(a) * d;
    hk(x, y, "*:.,"[i % 4], `rgba(225,235,250,${0.18 + RK() * 0.22})`);
  }
  /* KARDAN ADAM (15 Ekim, Gökşin: "sol alt köşeye, tamamen beyaz, Magnus gibi * ile dolu"): üç top
     hücre hücre doldurulur (hücre eni 0,6 → daireler en/boy düzeltmeli); şapka, kömür gözler, havuç
     burun, düğmeler, dal kollar üstüne. Ayakları kar yığınına gömülü (yığın sonra çiziliyor). */
  /* 15 Ekim (Gökşin onayladı): döngü boyunca şapkasında ve omuzlarında kar BİRİKİR, sonra SİLKELENİR
     (sallanır, kar saçılıp düşer), ardından iki kez GÖZ KIRPAR ("oh, rahatladım"). */
  const tt = ((t % T) + T) % T, SK = 100, SS = 1.6;
  const silk = tt >= SK && tt < SK + SS, zarf = silk ? Math.sin(Math.PI * (tt - SK) / SS) : 0;
  const ax = (Pn.x0 + kx) / 2 + Math.sin((tt - SK) * 28) * 0.35 * zarf, taban = Pn.alt - 0.3, BEYAZ = "rgb(244,247,255)";
  const sonra = tt - (SK + SS), kirp = (sonra > 0.2 && sonra < 0.4) || (sonra > 0.65 && sonra < 0.85);
  const birik = (((tt - (SK + SS)) % T) + T) % T / (T - SS);              // 0 (silkelendi) → 1 (yeniden dolu)
  // şapkasındaki kar dahil boyu ~9 satır; alt bölme kısaysa küçülür (şapka opak kaydın arkasına girmesin)
  const sc = Math.min(1, (taban - (ky + 1.6)) / 9);
  const TOP = [[taban - 1.8 * sc, 1.8 * sc], [taban - 4.6 * sc, 1.3 * sc], [taban - 6.75 * sc, 1.0 * sc]];   // üç ayrı top   // [merkez y, yarıçap (satır)]
  const hy = TOP[2][0], my2 = TOP[1][0];
  const goz = kirp ? "-" : "o";
  const YUZ = [[ax - 0.9, hy - 0.25, goz, "rgb(45,45,60)"], [ax + 0.9, hy - 0.25, goz, "rgb(45,45,60)"],   // kömür gözler
               [ax, hy + 0.45, ">", "rgb(235,120,30)"],                                                 // havuç
               [ax, my2 - 0.5, "o", "rgb(70,70,85)"], [ax, my2 + 0.6, "o", "rgb(70,70,85)"]];          // düğmeler
  // İNCE ızgara (Magnus gibi, yarım hücre): kaba ızgarada toplar köşeli ve boşluklu görünüyordu
  ctx.font = `bold ${yazi(0.7)}`;
  for (let y = taban - 7.8; y <= taban + 0.01; y += 0.42)
    for (let x = ax - 7; x <= ax + 7; x += 0.45){
      if (!TOP.some(([my, r]) => ((x - ax) * 0.55 / r) ** 2 + ((y - my) / r) ** 2 <= 1)) continue;
      if (YUZ.some(([fx, fy]) => Math.abs(fx - x) < 0.6 && Math.abs(fy - y) < 0.45)) continue;   // yüz/düğme boşluğu
      hk(x, y, "*", BEYAZ);
    }
  ctx.font = `bold ${yazi()}`;
  YUZ.forEach(([x, y, k, r]) => hk(x, y, k, r));
  [0, 1].forEach(j => hk(ax - 3.3 * sc - j, my2 - 0.5 - j * 0.8, "\\", "rgb(150,105,65)"));           // sol dal kol
  [0, 1].forEach(j => hk(ax + 3.3 * sc + j, my2 - 0.5 - j * 0.8, "/", "rgb(150,105,65)"));            // sağ dal kol
  const sap = "rgb(150,150,175)";                                                             // şapka
  for (let x = -1.8; x <= 1.8; x += 0.6) hk(ax + x * sc, hy - 1.05 * sc, "_", sap);
  hk(ax - 0.7, hy - 1.6 * sc, "[", sap); hk(ax, hy - 1.6 * sc, "_", sap); hk(ax + 0.7, hy - 1.6 * sc, "]", sap);
  // biriken kar: şapka kenarı, şapka tepesi, omuzlar (orta topun üst yayı)
  const RB = rastgele(31), YER = [];
  for (let i = 0; i < 16; i++){
    if (i < 4) YER.push([[-1.75, -1.2, 1.2, 1.75][i] * sc, hy - 1.5 * sc]);   // şapka kenarı (şapkanın iki yanı)
    else if (i < 8) YER.push([-0.9 + (i - 4) * 0.6, hy - 2.15 * sc]);    // şapka tepesi
    else { const a = Math.PI * (0.18 + (i - 8) / 7 * 0.64), r = TOP[1][1];   // omuzlar
      YER.push([Math.cos(a) * r / 0.55 * (i % 2 ? 1 : -1), my2 - Math.sin(a) * r - 0.35]); }
  }
  const ucus = tt >= SK && tt < SK + 2.4 ? (tt - SK) / 2.4 : null;       // silkelenince saçılır
  YER.forEach(([x, y], i) => {
    const yon = x >= 0 ? 1 : -1, k = RB() < 0.5 ? "*" : ".";
    if (ucus !== null) hk(ax + x + yon * ucus * (2 + (i % 3)), y - ucus * 1.2 + ucus * ucus * 6, k, `rgba(244,247,255,${1 - ucus})`);
    else if (i < birik * YER.length) hk(ax + x, y, k, BEYAZ);
  });
  ctx.font = `bold ${yazi()}`;
  // lapa lapa kar: yavaş, sallanarak
  const R = rastgele(9), h = Pn.alt - Pn.ust + 3;
  for (let i = 0; i < 55; i++){
    const hiz = 1.1 + R() * 1.8, yy = ((t * hiz + R() * 100) % h) + Pn.ust - 1;
    const xx = Pn.x0 + R() * (Pn.x1 - Pn.x0) + Math.sin(t * (0.6 + R()) + i) * 0.9;
    hk(xx, yy, R() < 0.3 ? "*" : R() < 0.6 ? "." : "o", `rgba(240,245,255,${0.55 + R() * 0.4})`);
  }
  // kar yığını: alt bölmelerin dibinde dalgalı beyaz tümsek (kardan adamın ayağını örter)
  ctx.fillStyle = "rgba(228,235,248,.95)";
  for (let x = Pn.x0 + 1; x < Pn.x1; x += 0.5){
    const yuk = 1.1 + 0.6 * Math.sin(x * 0.45) + 0.3 * Math.sin(x * 1.3 + 1);
    ctx.fillRect(x * cw, (Pn.alt - yuk) * ch, cw * 0.5 + 1, yuk * ch);
  }
}

/* ── PERDE (14 Ekim, Gökşin: "hafifçe sallanan; pencere boyunu geçsin ama yere kadar inmesin"):
   korniş + iki yanda kıvrımlı bordo kumaş. Üstten tutturulmuş: sallanma aşağı indikçe artar.
   Işıktan ÖNCE çizilir → şöminenin ışığıyla boyanır. ── */
function perdeCiz(t){
  const Pn = L.pencere, ust = Pn.ust - 2, alt = Pn.alt + Math.round((L.duvarAlt - Pn.alt) * 0.45);
  const GEN = 4, kivrim = ["(", "|", ")", "|"];
  ctx.font = `bold ${yazi()}`;
  // korniş
  for (let x = Pn.x0 - GEN - 2; x <= Pn.x1 + GEN + 2; x++) hk(x, ust - 1, "=", "rgb(150,110,75)");
  hk(Pn.x0 - GEN - 3, ust - 1, "o", "rgb(190,150,100)"); hk(Pn.x1 + GEN + 3, ust - 1, "o", "rgb(190,150,100)");
  for (const [bas, yon] of [[Pn.x0 - GEN - 1, 1], [Pn.x1 + 2, -1]]){
    for (let y = ust; y <= alt; y++){
      const u = (y - ust) / (alt - ust);
      const kay = u * u * (0.9 * dalga(5, t, bas) + 0.35 * dalga(13, t, bas + 2));   // üst sabit, uç salınır
      const x0 = bas + kay;
      ctx.fillStyle = "rgb(100,42,36)"; ctx.fillRect(x0 * cw, y * ch, GEN * cw + 1, ch + 1);   // arkası görünmesin
      for (let i = 0; i < GEN; i++){
        const k = y === alt ? "~" : kivrim[(i + (yon < 0 ? 1 : 0)) % 4];
        hk(x0 + i, y, k, i % 2 ? "rgb(235,130,105)" : "rgb(195,88,74)");
      }
    }
  }
}

/* ── OYUNCAK SEPETİ (14–15 Ekim, Gökşin'in tarifi): pencerenin hemen altında, yerde, duvara
   yaslı büyükçe hasır sepet; iki yanında tutma sapları. İçinde kiremit-kırmızı bir yumak (ipi
   sepetin önünden aşağı sarkıp sallanıyor) ve yanında yalnız başı + kolları görünen oyuncak
   ayıcık. Kedi gibi kendi renginde (ışıktan sonra). Dikey ekranda sola taşacaksa çizilmez. ── */
const SEPET = [
  "            ()_()    ",
  "    .@@@.   (o o)    ",
  "   (@@@@@) c( - )o   ",
  "  (|===============|)",
  "   |\\/\\/\\/\\/\\/\\/\\/\\|  ",
  "   |/\\/\\/\\/\\/\\/\\/\\/|  ",
  "   '---------------'  ",
];
function sepetCiz(t){
  const S = L.sepet, K = 1.5, kcw = cw * K, kch = ch * K;
  const x0 = S.x * cw + cw / 2 - 10.5 * kcw, y0 = (S.y + 1) * ch - SEPET.length * kch;
  if (x0 < 0) return;
  ctx.font = `bold ${yazi(K)}`;
  const IP = "rgb(206,92,64)";
  const arka = py => py + kch / 2 < (L.duvarAlt + 0.5) * ch ? DUVAR_RENK : ZEMIN_RENK;
  // 1) satırların arkası (duvar/zemin deseni görünmesin)
  SEPET.forEach((s, y) => {
    const ilk = s.search(/\S/), son = s.length - [...s].reverse().join("").search(/\S/) - 1, py = y0 + y * kch;
    ctx.fillStyle = arka(py); ctx.fillRect(x0 + ilk * kcw, py, (son - ilk + 1) * kcw + 1, kch + 1);
  });
  /* 2) OLTA (15 Ekim, Gökşin): yumakla ayıcığın arasından çıkan, ayıcığın başının ARKASINDAN
     geçen eğik sopa; altta kalın tutma yeri, sonra ince; ucunda minik top, topun ucunda sallanan
     tüy (Dobby'nin oltası). Ayıcıktan önce çizilir, ayıcığın arkası yeniden boyanınca arkada kalır. */
  const ox = (c, r) => x0 + c * kcw + kcw / 2, oy = r => y0 + r * kch + kch / 2;
  // ince kısım (tutma yeri yumağın ÖNÜNDE, karakterlerden sonra çiziliyor — aşağıda)
  ctx.font = yazi(K);
  ctx.fillStyle = "rgb(190,145,95)";
  const A = [10.4, 0.9], B = [18.2, -3.4];
  for (let u = 0; u <= 1.0001; u += 0.07) ctx.fillText("/", ox(A[0] + (B[0] - A[0]) * u, 0), oy(A[1] + (B[1] - A[1]) * u));
  ctx.font = `bold ${yazi(K * 1.7)}`;                                                                    // top: büyükçe
  ctx.fillStyle = "rgb(120,175,215)"; ctx.fillText("o", ox(B[0] + 0.45, 0), oy(B[1] - 0.45));
  ctx.font = `bold ${yazi(K)}`;
  const sal = 0.7 * dalga(9, t, 1) + 0.25 * dalga(23, t, 2);
  ctx.fillStyle = "rgb(150,205,225)";
  [[")", 0.9], ["{", 1.6], [",", 2.2]].forEach(([k, d], j) =>                                            // tüy, aşağı sallanır
    ctx.fillText(k, ox(B[0] + 0.5 + sal * (j + 1) * 0.45, 0), oy(B[1] + d - 0.3)));
  // ayıcığın arkası yeniden: sopa başının arkasında kalsın
  for (let y = 0; y <= 2; y++){ const py = y0 + y * kch; ctx.fillStyle = arka(py); ctx.fillRect(x0 + 11.6 * kcw, py, 5.8 * kcw, kch + 1); }
  // 3) karakterler
  SEPET.forEach((s, y) => {
    const py = y0 + y * kch;
    [...s].forEach((k, i) => {
      if (k === " ") return;
      let r;
      if (y <= 2 && i >= 11) r = k === "o" && y === 1 ? "rgb(255,232,195)" : "rgb(205,160,110)";   // ayıcık
      else if (k === "@" || (y <= 2 && "(.)".includes(k))) r = k === "." ? "rgb(240,140,100)" : IP;  // yumak
      else if (y === 3) r = (k === "(" || k === ")") ? "rgb(185,130,75)" : "rgb(210,155,92)";     // saplar + ağız
      else if (y === 6) r = "rgb(140,95,55)";
      else r = "rgb(172,116,66)";                                                                 // örgü
      ctx.fillStyle = r;
      ctx.fillText(k, x0 + i * kcw + kcw / 2, py + kch / 2);
    });
  });
  // oltanın kalın TUTMA YERİ: yumağın önünden çaprazlama (Gökşin: "kalın ucu yumağın önüne gelsin")
  for (let j = 0; j <= 4; j++){
    const r = 2.35 - j * 0.38, c = 8.4 + j * 0.42;
    ctx.fillStyle = arka(oy(r) - kch / 2); ctx.fillRect(ox(c, 0) - 0.45 * kcw, oy(r) - 0.45 * kch, 0.9 * kcw, 0.9 * kch);   // arkasındaki yumak görünmesin
    ctx.fillStyle = "rgb(150,100,60)"; ctx.fillText("#", ox(c, 0), oy(r));
  }
  // yumağın ipi: ağızdan sepetin önüne, oradan yere kadar sarkar; aşağı indikçe daha çok sallanır
  ctx.fillStyle = IP;
  for (let j = 0; j < 7; j++){
    const u = j / 6, dx = u * u * 0.9 * dalga(11, t, 0.5);
    ctx.fillText(j % 2 ? "(" : ")", x0 + (6 + dx) * kcw + kcw / 2, y0 + (3 + j * 0.85) * kch + kch / 2);
  }
}

/* ── SAAT: GERÇEK saati gösterir (açtığın an kaçsa o) ── */
function saatCiz(){
  const n = new Date(), dk = n.getMinutes() + n.getSeconds() / 60, sa = (n.getHours() % 12) + dk / 60;
  const kol = (aci, boy, kalin) => {
    // 15 Ekim (Gökşin): kol 12'ye bakarken bir çizgi kısa — rakamın üstüne binip karışmasın
    if (Math.cos(aci) > 0.85) boy -= 1;
    for (let i = 1; i <= boy; i++){
      const x = L.saat.x + Math.sin(aci) * i * 1.4, y = L.saat.y - Math.cos(aci) * i * 0.8;
      const a = ((aci % Math.PI) + Math.PI) % Math.PI;
      const k = a < 0.4 || a > 2.75 ? "|" : a < 1.2 ? "/" : a < 1.95 ? "-" : "\\";
      hk(Math.round(x), Math.round(y), k, kalin);
    }
  };
  ctx.font = `bold ${yazi()}`;
  kol(sa / 12 * 2 * Math.PI, 2, "rgb(200,200,200)");                  // akrep: kısa
  kol(dk / 60 * 2 * Math.PI, 3, "rgb(235,235,235)");                  // yelkovan: uzun (büyük kadran)
  hk(L.saat.x, L.saat.y, "o", "rgb(235,235,235)");
}

/* ── KARA KEDİ: halıda kıvrılmış uyuyor. Koyu gri gövde + ateş tarafında turuncu kenar
   ışığı. Nefes (sırt kabarır), kulak seğirmesi, kuyruk ucu; T içinde bir kez gözlerini
   açıp bakar (sarı-yeşil). ── */
/* 15 Ekim (Gökşin): döngüde bir kez GÖZ KIRPMA (, o , o , o ,) ve bir kez ESNEME ("4" pembe "o",
   esnerken gözler kapalı). Dokununca ise 3 sn boyunca gözler açık bakar. */
const KEDI_KIRP = 80, KEDI_ESNE = [112, 114.5];
/* KEDİYE DOKUNUNCA (15 Ekim, Gökşin): gözlerini açar ve adı belirir — keşif, hiçbir yerde
   anlatılmıyor. Kedinin adı AYRAÇ: Magnus'un açık bıraktığı kitapların üstüne yattığı için. */
let kediDokunus = -1e9;
c.addEventListener("pointerdown", e => {
  if (!L) return;
  const d = W / innerWidth, px = e.clientX * d, py = e.clientY * d;
  const kcw = cw * 1.5, kch = ch * 1.5, x0 = L.kedi.x * cw - 12 * kcw, y0 = (L.kedi.y + 1) * ch - 4 * kch;
  if (px < x0 || px > x0 + 25 * kcw || py < y0 - kch || py > y0 + 4 * kch) return;
  kediDokunus = performance.now();
  if (window.magnusMesaj) window.magnusMesaj("Ayraç · Favori uyku mekânı Magnus'un\naçık bıraktığı kitaplar olduğu için bu adı aldı.");
});
function kediCiz(t){
  const tt = t % T, kd = tt - KEDI_KIRP;
  const kirpiyor = kd >= 0 && kd < 2.1 && Math.floor(kd / 0.35) % 2 === 0;   // ~0,35 sn açık / kapalı, üç kez
  const esniyor = tt >= KEDI_ESNE[0] && tt < KEDI_ESNE[1];
  const uyanik = (kirpiyor || performance.now() - kediDokunus < 3000) && !esniyor;
  const nefes = dalga(24, t) > 0;                                       // ~3 sn'de bir
  const kulak = Math.abs((t * 0.37) % 11 - 5) < 0.12;                   // arada bir seğirir
  const kuyruk = dalga(7, t) > 0.6 ? "," : "~";
  // Kıvrılmış uyuyan kedi — Felix Lee'nin klasik ASCII kedisinden uyarlandı. ",4-" kapalı göz.
  const sanat = [
    (kulak ? "  |/" : "  |\\") + (nefes ? "      _,,,----,_" : "      _,,,---,,_") + "      ",
    /* 15 Ekim (Gökşin): gözler alt alta duran iki ","; "4" ağız. Uyanınca İKİ virgül yeşil "o" olur,
       ağız yerinde kalır (eskiden "4" yeşil o oluyordu → esniyor gibiydi). */
    "  /" + (uyanik ? "o" : ",") + "`.-'`'    -.  ;-;;,_",
    "  |" + (uyanik ? "o" : ",") + (esniyor ? ((tt - KEDI_ESNE[0]) > 0.8 && (tt - KEDI_ESNE[0]) < 2.0 ? "O" : "o") : "4") + "-  ) )-,_. ,\\ (  `'-" + (kuyruk === "," ? "," : "'"),
    " '---''(_/--'  `-'\\_)",
  ];
  /* TURUNCU TEKİR, 1,5 kat iri (Gökşin: kara kedi siyah zeminde seçilmiyordu, "kara kedi gibi
     durmuyor"). Gövde turuncu, sırt çizgileri koyu, ateş tarafı açık kenar ışığı. */
  const K = 1.5, kcw = cw * K, kch = ch * K;
  const x0 = L.kedi.x * cw - 12 * kcw, y0 = (L.kedi.y + 1) * ch - sanat.length * kch;
  ctx.font = `bold ${yazi(K)}`;
  sanat.forEach((s, y) => {
    let ilk = 0; while (ilk < s.length && s[ilk] === " ") ilk++;
    let son = s.length - 1; while (son > 0 && s[son] === " ") son--;
    ctx.fillStyle = ZEMIN_RENK;                                         // halı deseni içinden görünmesin
    ctx.fillRect(x0 + ilk * kcw, y0 + y * kch, (son - ilk + 1) * kcw + 1, kch + 1);
    [...s].forEach((k, i) => {
      if (k === " ") return;
      let renk = (i + y) % 3 === 0 && y < 3 ? "rgb(165,92,40)" : "rgb(222,142,70)";   // tekir çizgileri
      if (i >= son - 1) renk = "rgb(255,200,130)";                      // ateş tarafı: kenar ışığı
      if (uyanik && (y === 1 || y === 2) && i === 3) renk = "rgb(170,235,70)";   // gözler
      if (esniyor && y === 2 && i === 4) renk = "rgb(240,140,160)";                // esneyen ağız (pembe)
      ctx.fillStyle = renk;
      ctx.fillText(k, x0 + i * kcw + kcw / 2, y0 + y * kch + kch / 2);
    });
  });
}

/* ── ÇAY BUHARI: fincandan yükselip savrulan, sönen kıvrımlar ── */
/* ── HAYALET ÇAY (15 Ekim, Gökşin onayladı): Magnus hayalet olduğu için demlik dokunulmadan
   havalanır: fincanın sol üstünde belirir, eğilip fincana çay döker, düzelir, söner. Döngüde bir
   kez (CAY_BAS. saniyede). Dökme anı çay sesiyle eş (ortak.js magnusCaySesi — oda'da çay sesi
   rastgele çalmaz, sayfa sesi gibi). Ses dosyası ~3,7 sn → dökme 4 sn. ── */
const CAY_BAS = 30, CAY_SURE = 10;
let _caySes = false;
setTimeout(() => window.magnusSesHazirla && window.magnusSesHazirla("caydanlik"), 2000);
function cayEvre(t){ const tt = ((t % T) + T) % T - CAY_BAS; return tt >= 0 && tt < CAY_SURE ? tt : null; }
function cayCiz(t){
  const e = cayEvre(t);
  const dokuyor = e !== null && e >= 3 && e < 7;
  /* 15 Ekim (Gökşin: "ses animasyon bitmek üzereyken başlıyor"): ses dökmeden ~2 sn ÖNCE tetiklenir
     (dosyanın başında boşluk + ilk çalışta yükleme gecikmesi); ses dosyası açılışta önceden yüklenir. */
  const sesAni = e !== null && e >= 1 && e < 7;
  if (sesAni !== _caySes){ _caySes = sesAni; if (sesAni && DONUK === null && window.magnusCaySesi) window.magnusCaySesi(); }
  if (e === null) return;
  const K = L.K, kcw = cw * K, kch = ch * K;
  const cx = L.sehpa.x + 4.5 * K, cy = L.sehpa.y - 10 * K;                 // fincanın ağzı (hücre)
  const gor = e < 1.5 ? e / 1.5 : e > 8.5 ? (CAY_SURE - e) / 1.5 : 1;      // belir / sön
  const yuk = e < 2 ? (1 - e / 2) * 2 : e > 8 ? (e - 8) * 1 : 0;           // aşağıdan yükselir, inerken söner
  const egim = e < 2 ? 0 : e < 3 ? (e - 2) * 0.38 : e < 7 ? 0.38 + 0.03 * Math.sin(e * 5) : e < 8 ? (8 - e) * 0.38 : 0;
  const bx = (cx - 4.6 * K) * cw + cw / 2, by = (cy - 3.4 * K + yuk) * ch + ch / 2;   // demlik gövde ortası (px)
  const DEMLIK = ["  _^_     ", " (   )__/ ", "(     )   ", " `---'    "];
  ctx.save();
  ctx.globalAlpha = 0.9 * gor;
  ctx.shadowColor = "rgba(255,240,210,.7)"; ctx.shadowBlur = 10;           // hayalet ışıltısı
  ctx.translate(bx, by); ctx.rotate(egim);
  ctx.font = `bold ${yazi(K)}`; ctx.fillStyle = "rgb(236,228,210)";
  DEMLIK.forEach((s, y) => [...s].forEach((k, i) => { if (k !== " ") ctx.fillText(k, (i - 3.5) * kcw, (y - 1.5) * kch); }));
  ctx.restore();
  if (dokuyor){
    // akış: emziğin ucundan (yerel +4,5 / −0,5 karakter) fincana
    const ux = bx + Math.cos(egim) * 4.5 * kcw - Math.sin(egim) * -0.5 * kch, uy = by + Math.sin(egim) * 4.5 * kcw + Math.cos(egim) * -0.5 * kch;
    const hx = cx * cw + cw / 2, hy = cy * ch + ch / 2, n = 7;
    ctx.font = `bold ${yazi(K)}`;
    ctx.shadowColor = "rgba(255,170,80,.6)"; ctx.shadowBlur = 6;
    for (let i = 0; i <= n; i++){
      const u = i / n, x = ux + (hx - ux) * u * u, y = uy + (hy - uy) * u;   // emzikten çıkıp aşağı kıvrılır
      ctx.fillStyle = `rgba(232,150,64,${0.95 - 0.3 * (((i + Math.floor(e * 10)) % 3) === 0)})`;
      ctx.fillText("|", x, y);
    }
    ctx.shadowBlur = 0;
  }
}
function buharCiz(t){
  const K = L.K;
  ctx.font = yazi(K);
  // çay dökülürken ve hemen sonra buhar çoğalır
  const e = cayEvre(t), cok = e !== null && e >= 3 && e < CAY_SURE;
  for (let i = 0; i < (cok ? 6 : 3); i++){
    const u = ((t * 0.35 + i / (cok ? 6 : 3)) % 1);                     // 0 → 1: yükseliş
    // fincan: sehpanın sağ yarısında, üst kenarı tabla + 5 satır yukarıda (sehpa K kat büyük)
    // 15 Ekim (Gökşin): buhar Magnus'la fincanın arasından çıkıyordu → fincanın üstüne (sola) alındı
    const x = L.sehpa.x + (2.6 + i * (cok ? 0.7 : 1.4) + Math.sin(u * 6 + i) * 0.8) * K, y = L.sehpa.y - (11 + u * 4) * K;
    hk(x, y, u < 0.5 ? "(" : ")", `rgba(230,230,230,${0.45 * (1 - u)})`);
  }
}

/* ── MAGNUS + SALLANAN SANDALYE ─────────────────────────────────────────
   Şekil bir fonksiyon (orman sahnesindeki yedek ASCII Magnus'un oturan hâli), her karede
   küçük bir tuvale ızgara olarak çizilip KIZAK ORTASI etrafında döndürülerek konuyor.
   Yerel birim: satır yüksekliği; x sütunda 0.6 (hücre eni). Kökten yukarı eksi. */
const MG = document.createElement("canvas"), mgx = MG.getContext("2d");
const MG_SUT = 34, MG_SAT = 26;                        // yerel ızgara (kök: alt orta)
const RAMPA_H = " .:-=+*o#";
const SAYFALAR = [20, 58, 59.6, 97, 128], SAYFA_SURE = 1.4;
let _sonSayfa = null;
/* YANDAN, ÇAPRAZ OTURAN MAGNUS (Gökşin: "yan veya daha çapraz oturuyor"): yüzü şömineye
   (sola) dönük, sırtı geriye yatık arkalığa yaslı, dizleri öne uzanmış, örtü dizlerin
   önünden dalgalı sarkıyor; kitabı önünde, kolu ona uzanıyor. Birim: satır; X = sütun × 0.6. */
function magnusSekil(X, Y, t){
  // döndür: 0 = boş, -1 = göz, -2 = kitap kapağı, -3 = kitap sayfası, >0 = örtü yoğunluğu
  const nefes = 1 + 0.03 * dalga(16, t);
  const hx = -1.4, hy = -17.2, R = 3.6;
  if (((X + 3.1) / 0.6) ** 2 + ((Y + 17.4) / 0.95) ** 2 < 1) return -1;        // öndeki göz
  if (((X + 1.2) / 0.42) ** 2 + ((Y + 17.6) / 0.8) ** 2 < 1) return -1;        // arkadaki göz (üç çeyrek)
  // kitap: önde, hafif eğik tutulmuş; üst kenarında açık sayfalar
  const kitapY = -11.6 + (X + 5) * 0.12;
  if (X > -7.2 && X < -3.4 && Y > kitapY - 2 && Y < kitapY + 1) return Y < kitapY - 1.3 ? -3 : -2;
  // kol: gövdeden kitaba
  const ax = -1.6, ay = -11.2, bx = -4.6, by = -11.9;
  const u = Math.max(0, Math.min(1, ((X - ax) * (bx - ax) + (Y - ay) * (by - ay)) / ((bx - ax) ** 2 + (by - ay) ** 2)));
  if (Math.hypot(X - (ax + u * (bx - ax)), Y - (ay + u * (by - ay))) < 0.95) return 0.55;
  if (Y < hy){ const d = Math.hypot(X - hx, Y - hy); return d < R ? 0.5 + 0.4 * (1 - d / R) : 0; }
  // gövde: geriye yaslı (aşağı indikçe sağa kayar)
  const s = (Y - hy) / 12.5;
  if (s <= 1){
    const cx = hx + 2.0 * s, w = R * nefes * (0.95 + 0.6 * Math.pow(s, 1.4));   // çan gibi açılır
    const q = (X - cx) / w;
    // kıvrımlar ÇAPRAZ (yatay bantlar perde gibi duruyordu)
    if (Math.abs(q) <= 1) return 0.3 + 0.4 * (1 - Math.abs(q)) + 0.2 * (0.5 + 0.5 * Math.sin(X * 1.3 - Y * 0.6));
  }
  // kucak / dizler: oturak hizasında öne uzanan yuvarlak kütle
  const kd = ((X + 3.6) / 4.4) ** 2 + ((Y + 5.0) / 1.9) ** 2;
  if (kd < 1) return 0.4 + 0.35 * (1 - kd) + 0.15 * (0.5 + 0.5 * Math.sin(X * 1.5 + Y));
  // dizlerin önünden sarkan örtü: aşağı indikçe DIŞA açılır (kumaş gibi), ucu dalgalı
  if (Y > -5.4){
    const sol = -7.6 - (Y + 5.4) * 0.28, sag = -4.2 + (Y + 5.4) * 0.05;
    const etek = -0.9 + 0.45 * Math.abs(Math.sin((X + 8) * 2.1 + 0.8 * dalga(9, t)));
    if (X > sol && X < sag && Y < etek) return 0.3 + 0.3 * (0.5 + 0.5 * Math.sin(X * 2.2 - Y * 1.4));
  }
  return 0;
}
function sandalyeCiz(koy){
  const kh = "rgb(150,108,72)";
  for (let x = -12; x <= 12; x++){                                     // kavisli kızak (uçlar kalkık)
    const y = -Math.round(0.018 * x * x);
    koy(x, y, x < -8 ? "\\" : x > 8 ? "/" : "_", kh);
  }
  for (let y = -1; y >= -3; y--){ koy(-5, y, "|", kh); koy(4, y, "|", kh); }   // ayaklar
  for (let x = -6; x <= 5; x++) koy(x, -4, "=", kh);                   // oturak
  for (let y = -5; y >= -22; y--){                                     // GERİYE YATIK arkalık
    const x = 4.5 + (-4 - y) * 0.22;
    koy(x, y, "/", kh); koy(x + 1.3, y, "/", kh);
    if (y % 5 === 0) koy(x + 0.65, y, "=", kh);
  }
  koy(8.8, -23, "_", kh); koy(9.8, -23, "_", kh);
  for (let x = -6; x <= 3; x++) koy(x, -8, "-", kh);                   // kolçak (çoğu gövdenin arkasında)
}
/* GÖKŞİN'İN ÇİZİMİ İÇİN HAZIR YER (27 Eylül). `gorsel/magnus-sandalye.png` yüklenirse ASCII
   Magnus + sandalyenin yerine o çizilir; yoksa (ya da açılamazsa) ASCII kalır — KOD GEREKMEZ.
   Resim kuralları (Gökşin'e söylendi): arka plan SAYDAM, kızağın alt ucu resmin EN ALTINA değecek
   şekilde kırpılmış. Sallanma resmin alt-orta noktası etrafında; boy = ASCII Magnus'un boyu. */
const SANDALYE_RESIM = new Image(); let sandalyeHazir = false;
SANDALYE_RESIM.onload = () => { sandalyeHazir = SANDALYE_RESIM.naturalWidth > 0; if (DONUK !== null) ciz(DONUK); };
SANDALYE_RESIM.src = "gorsel/magnus-sandalye.png";
function sandalyeResimCiz(t){
  // sayfa sesi ASCII'deki gibi aynı anlarda çalsın (resimde sayfa çizilmiyor)
  const tt = ((t % T) + T) % T, s = SAYFALAR.find(b => tt >= b && tt < b + SAYFA_SURE);
  if (s !== _sonSayfa){ _sonSayfa = s; if (s !== undefined && DONUK === null && window.magnusSayfaSesi) window.magnusSayfaSesi(); }
  // ASCII Magnus'un kutusuna sığdır (en MG_SUT sütun, boy MG_SAT satır): geniş çizim sehpaya/kenara taşmasın
  const oran = SANDALYE_RESIM.naturalWidth / SANDALYE_RESIM.naturalHeight;
  const boy = Math.min(MG_SAT * ch, MG_SUT * cw / oran), en = boy * oran;
  ctx.save();
  ctx.translate(L.magnus.x * cw + cw / 2, (L.magnus.y + 1) * ch);
  ctx.rotate(0.045 * dalga(14, t));
  ctx.scale(L.K, L.K);                                 // ASCII Magnus kadar büyük
  ctx.drawImage(SANDALYE_RESIM, -en / 2, -boy, en, boy);
  ctx.restore();
}
function magnusCiz(t){
  if (sandalyeHazir) return sandalyeResimCiz(t);
  const K = L.K, kw = cw * K, kh = ch * K;
  MG.width = Math.ceil(MG_SUT * kw); MG.height = Math.ceil(MG_SAT * kh);
  mgx.font = `bold ${yazi(K)}`; mgx.textBaseline = "middle"; mgx.textAlign = "center";
  const kok = [MG_SUT / 2, MG_SAT - 1];
  const koy = (x, y, k, renk) => { mgx.fillStyle = renk; mgx.fillText(k, (kok[0] + x) * kw + kw / 2, (kok[1] + y) * kh + kh / 2); };
  sandalyeCiz(koy);
  /* Magnus İNCE ızgarayla (F = 0.7): kaba ızgarada kucak, diz ve sarkan etek kayboluyordu.
     Sandalye normal ızgarada kalıyor. */
  const F = 0.7, fw = kw * F, fh = kh * F;
  mgx.font = `bold ${yazi(F * K)}`;
  const inceKoy = (fx, fy, k, renk) => { mgx.fillStyle = renk; mgx.fillText(k, kok[0] * kw + kw / 2 + fx * fw, kok[1] * kh + kh / 2 + fy * fh); };
  for (let fy = Math.round(-(MG_SAT - 1) / F); fy <= 0; fy++) for (let fx = Math.round(-MG_SUT / 2 / F); fx < MG_SUT / 2 / F; fx++){
    const d = magnusSekil(fx * F * 0.6, fy * F, t);
    if (d === 0) continue;
    // Magnus'un arkasındaki sandalye çizgisi görünmesin
    // (siyah boyamak yerine SİL: duvar tonu altından görünsün)
    mgx.clearRect(kok[0] * kw + kw / 2 + (fx - 0.5) * fw, kok[1] * kh + kh / 2 + (fy - 0.5) * fh, fw + 1, fh + 1);
    if (d === -1) continue;
    if (d === -2) inceKoy(fx, fy, (fx + fy) % 3 === 0 ? "=" : "#", "rgb(168,72,48)");        // kapak
    else if (d === -3) inceKoy(fx, fy, fx % 2 ? "^" : "~", "rgb(238,228,205)");                // açık sayfalar
    // örtü: 26 Eylül'de KALINLAŞTI (Gökşin: "Magnus'un kendisi çok silik") — tam opak, rampada
    // iki basamak daha dolgun karakter; eskisi yarı saydam " .:-" ağırlıklıydı
    else inceKoy(fx, fy, RAMPA_H[Math.max(3, Math.min(8, Math.round(d * 6) + 2))], `rgb(${Math.round(225 + 25 * Math.min(1, d))},${Math.round(212 + 25 * Math.min(1, d))},185)`);
  }
  mgx.font = `bold ${yazi(K)}`;
  // SAYFA ÇEVİRME: kitabın üstünde sağdan sola kıvrılan sayfa (+ ses, ortak.js)
  const tt = ((t % T) + T) % T, s = SAYFALAR.find(b => tt >= b && tt < b + SAYFA_SURE);
  if (s !== _sonSayfa){ _sonSayfa = s; if (s !== undefined && DONUK === null && window.magnusSayfaSesi) window.magnusSayfaSesi(); }
  if (s !== undefined){
    const p = (tt - s) / SAYFA_SURE, th = Math.PI * p * p * (3 - 2 * p);
    for (let i = 1; i <= 3; i++){                        // kitabın üst kenarından (yan oturuşta sol-önde)
      const x = -9 + Math.cos(th) * i * 1.1, y = -14.2 - Math.sin(th) * i * 0.5;
      koy(Math.round(x), Math.round(y), th < 1.2 ? "/" : th < 1.95 ? "|" : "\\", "rgb(245,236,212)");
    }
  }
  // sallanma: kızağın ortası etrafında
  const aci = 0.045 * dalga(14, t);
  ctx.save();
  ctx.translate(L.magnus.x * cw + cw / 2, L.magnus.y * ch + ch / 2);
  ctx.rotate(aci);
  // 14 Ekim: K kat büyük (Gökşin: "ana karakter göze görünmüyor"). Küçük tuvali büyütmek yazıyı
  // bulanıklaştırırdı → tuval K kat çözünürlükte kurulur (yukarıda kw/kh), burada ölçek yok.
  ctx.drawImage(MG, -kok[0] * kw - kw / 2, -kok[1] * kh - kh / 2);
  ctx.restore();
}

/* ── IŞIK: şömine tek kaynak; titrer. Karanlık + sarı-turuncu (orman/kütüphane dili). ── */
function isik(t){
  const fx = L.somine.cx * cw, fy = (L.ates.ust + L.ates.alt) / 2 * ch;
  const tit = 1 + 0.06 * dalga(37, t) + 0.04 * dalga(91, t, 1) + 0.03 * dalga(153, t, 2);
  // 26 Eylül: karanlık yumuşadı (en koyu 0.85 → 0.30), odanın köşeleri de seçilsin
  const r = 1.2 * H * tit;
  const gr = ctx.createRadialGradient(fx, fy, 0, fx, fy, r);
  gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(0.45, "rgba(0,0,0,0.04)");
  gr.addColorStop(0.8, "rgba(0,0,0,0.18)"); gr.addColorStop(1, "rgba(0,0,0,0.30)");
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = "multiply";
  // sıcak ışık bütün odaya: dışarısı beyaz değil kehribar-krem (şömine odayı dolduruyor)
  const r2 = 1.0 * H * tit, g = ctx.createRadialGradient(fx, fy, 0, fx, fy, r2);
  g.addColorStop(0, "rgb(255,150,55)"); g.addColorStop(0.4, "rgb(255,190,105)");
  g.addColorStop(0.8, "rgb(255,220,170)"); g.addColorStop(1, "rgb(245,222,190)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = "source-over";
}

/* ── KARE ── */
/* DUVAR/ZEMİN TONU (26 Eylül, Gökşin'in telefon/tablet görüntüleri): siyah zeminde çizgiler
   boşlukta yüzüyordu, parlaklık artışı fark edilmedi → tablodaki gibi koyu sıcak kahve duvar,
   daha koyu zemin. YALNIZ ODA; orman ve kütüphane siyah kalır. */
const DUVAR_RENK = "rgb(46,31,22)", ZEMIN_RENK = "rgb(28,19,14)";
function ciz(t){
  ctx.fillStyle = ZEMIN_RENK; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = DUVAR_RENK; ctx.fillRect(0, 0, W, (L.duvarAlt + 0.5) * ch);
  ctx.drawImage(ARKA, 0, 0);
  ctx.textBaseline = "middle"; ctx.textAlign = "center";
  saatCiz();
  perdeCiz(t);
  isik(t);                                             // oda (saat dahil) ateşle boyanır
  pencereCiz(t);
  atesCiz(t);
  kediCiz(t);
  sepetCiz(t);
  buharCiz(t);
  cayCiz(t);
  magnusCiz(t);                                        // Magnus kendi renginde
  if (simsekMi(t)){ ctx.fillStyle = "rgba(200,210,255,.10)"; ctx.fillRect(0, 0, W, H); }
}

function boyutlandir(){
  if (innerWidth < 50 || innerHeight < 50) return;     // arka plandayken gelen sıfır boyut
  const d = Math.min(window.devicePixelRatio || 1, 2);
  W = c.width = Math.round(innerWidth * d); H = c.height = Math.round(innerHeight * d);
  ch = H / SATIR; cw = ch * 0.6; SUTUN = Math.ceil(W / cw);
  L = yerlesim(); arkaKur(); atesKur();
}
let bas = null;
function dongu(ms){
  if (bas === null) bas = ms;
  try { ciz(((ms - bas) / 1000) % T); } catch (e) {}
  requestAnimationFrame(dongu);
}
/* Ekran kapanıp açılınca telefon bellekteki yardımcı tuvalleri SİLEBİLİYOR (Gökşin, 12 Ekim:
   ekran açılınca kütüphanede Magnus yoktu, mum ve kitaplar duruyordu). Boyut değişmese de
   her dönüşte hepsi yeniden kuruluyor (ucuz). */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  boyutlandir();
});
boyutlandir();
addEventListener("resize", () => { boyutlandir(); if (DONUK !== null) ciz(DONUK); });
if (DONUK !== null) ciz(DONUK); else requestAnimationFrame(dongu);
</script>
